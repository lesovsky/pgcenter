# ============================================================================
# Notes
# ============================================================================
notes: |
  Seeded from docs/roadmap-0.12.0.md section [017]. Roadmap already fixes: separate `archiver`
  view (not extra columns on `wal`, to avoid changing the recorded `report -W` layout), the w/W
  cycle+menu, record/report folded in, and the PG 19 FPI column on `wal`.

  Catalog facts verified LIVE (CI image lesovsky/pgcenter-testing:0.0.11, PG 14/17/18/19), not from
  release notes:
  - PG 19 pg_stat_wal adds `wal_fpi_bytes numeric` (attnum 4, after wal_bytes). PG 18 lacks it.
  - pg_stat_archiver is byte-identical on PG 14 and PG 19 -> no version branch.
  - pg_ls_archive_statusdir() ACL is {postgres, pg_monitor} — the same class as the pg_ls_waldir()
    the wal screen already calls unconditionally.
  - Fixtures run archive_mode=off with archive_command disabled, so integration tests can only
    prove the query executes; the behavioural gate is the stand.

  Scope change during the interview: the "cmdline hint when archive_mode is off" (Q7) was
  DOWNGRADED to a static view Msg (Q11), because the precedent it was modelled on turned out to be
  a static string rather than a conditional hint. The success criterion listing a cmdline hint is
  superseded accordingly.

  Correction applied to the code-research document: its §7.1 claimed DiffIntvl{0,0} routes column 0
  through diffPair and would abort every sample on the 'Archiver' literal, and called it the
  feature's highest risk. That is wrong — calculateDelta (internal/stat/postgres.go:589-597)
  short-circuits on a {0,0} interval and never calls diff(); both the TUI path (stat.go:440) and
  the report path (report/report.go:505 -> stat.Compare) go through it. §7.1, §1.1 and appendix I
  were rewritten in place.
