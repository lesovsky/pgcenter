# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_description:
    score: 85
    status: "complete"
    value: |
      PostgreSQL 19 compatibility baseline (roadmap 0.12.0, feature [012], done first in the release).
      Three parts:
      1. Test/CI infrastructure for PG 19: PostgresV19 = 190000 in internal/query/query.go, port 21919 in
         internal/postgres/testing.go, PG 19 cluster in the lesovsky/pgcenter-testing Docker image
         (rebuild + push, 0.0.10 → 0.0.11, both workflows + prepare-test-environment.sh updated).
      2. Verification pass over every existing screen on live PG 19 — turns "should work" into "tested".
      3. Additive PG 19 columns on three progress screens only: progress_vacuum (started_by, mode),
         progress_analyze (started_by), progress_basebackup (backup_type).
      Framing is honest: pgcenter does not break on PG 19 (version selectors are `>= PostgresV18` so 190000
      lands in the newest branch; all queries list columns explicitly). This is feature catch-up plus a
      tested guarantee, not an emergency fix.
    gaps: ""
    required: true

  user_problem:
    score: 85
    status: "complete"
    value: |
      pgcenter's core promise is that it tracks current PostgreSQL statistics. PG 19 beta 1 shipped 2026-06-04,
      GA expected September/October 2026. Today there is no evidence pgcenter works on PG 19 — no test cluster,
      no version constant, no CI run. A DBA upgrading to PG 19 has no way to know whether their monitoring tool
      still works until they try it in production. Additionally, on a long-running vacuum the DBA cannot see
      from pgcenter whether it is aggressive (PG 19 `mode`) without leaving for psql.
    gaps: ""
    required: true

  target_users:
    score: 85
    status: "complete"
    value: |
      Practicing PostgreSQL DBAs running or planning to run PG 19 (early adopters on beta/RC first, then the
      GA wave). Secondary: the maintainer — CI against PG 19 is the regression net for every later 0.12.0
      feature ([016]-[019] all add PG 19 queries).
    gaps: ""
    required: false

  success_criteria:
    score: 90
    status: "complete"
    value: |
      Confirmed by user (batch 1, Q4):
      1. CI is green with a PG 19 cluster in the test image.
      2. Every `top` screen renders on live PG 19 without errors and without empty columns where data exists;
         no panics.
      3. The three progress screens show the new columns on PG 19 and do not break on PG 14–18.
      4. overview.md + README list PG 19 as supported.
      Explicitly NOT an acceptance criterion: pg_stat_wal_receiver `connecting` status (display-only, no code).
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: |
      - PG 19 is beta: packages live in the separate pgdg-testing repo, catalog details can still change in
        beta 2/3/RC. Implementation is against beta; re-verification at RC/GA is planned but does not block
        the release.
      - Test image base is ubuntu:22.04 (jammy). If PG 19 beta packages are not built for jammy, fallback is
        moving the image to ubuntu:24.04 — user considers that bump overdue anyway (batch 1, Q1).
      - No regression on PG 14–18: every version selector change must keep older versions on their current
        queries.
      - Anti-rework boundary from the roadmap: PG 19 WAL FPI column → [016], pg_stat_replication_slots columns
        → [018], stats_reset/stats_age on tables/indexes/functions → [017]. Not in this feature.
      - Ubuntu base — conditional, final wording (supersedes the batch-2 formulation):
        * PG 19 installs on jammy  -> the base stays ubuntu:22.04; the noble bump is a separate task
          OUTSIDE this feature (user, batch 2, Q1).
        * PG 19 does NOT install on jammy -> the ubuntu:24.04 migration is pulled INTO this feature and
          BLOCKS it (user, batch 4, Q1, variant a — a conscious override of the agent's recommendation of
          variant b). On that path the feature effectively becomes "M + OS base migration"; size is
          re-assessed at tech-spec time, once the probe result is known.
      - The `*-pgdg-testing` repo line in testing/Dockerfile is temporary: at the GA rebuild it must be
        removed and PG 19 installed from the main pgdg repo, otherwise the next rebuild silently pulls the
        PG 20 beta. User asked for this to be registered as tech debt so it is not lost (batch 3, Q1).
    gaps: ""
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      Feature size M. Unit tests always. The internal/query/*_test.go suite is de-facto integration (runs
      against live clusters, t.Skipf on unavailable versions) — 190000 joins every versions list there, plus
      view_test.go TestView_VersionOK and record_test.go Test_filterViews rows.
      Manual QA (user, batch 1, Q2): a live PG 19 walk over every screen checking that everything works and
      nothing panics. No QA checklist artifact required in the feature dir.
      Manual walk scope = `top` only (user, batch 2, Q4). record/report/profile are covered by the automated
      suite, not by a manual pass — but the `report -P v|a|b` describe texts in report/report.go still need
      updating for the new columns (code change, not a QA item).
      Integration tests: yes — they are the point of the feature (the PG 19 cluster is the tested guarantee).
      E2E: no new ones; testing/e2e.sh runs as-is in CI against the new image.
      The concrete test perimeter (new per-selector unit tables at the 180000/190000 boundary, the report
      replay test with versionNum 180000/190000, and the deliberate exclusion of a VACUUM-racing test) is
      recorded under phase2_user_experience.verification_strategy — see there, not duplicated here.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
# Interview Cycle 2 scope (together with Phase 3)
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      All four accepted verbatim by the user (batch 3, Q4):
      1. As a DBA who upgraded to PG 19, I want to run `pgcenter top` and find every screen working, so that
         I do not discover compatibility problems on production by trial and error.
      2. As a DBA watching a long vacuum, I want to see in the `mode` column that it is `aggressive` or
         `failsafe`, so that I know whether the system is fighting wraparound right now — today that answer
         requires leaving for psql.
      3. As a DBA, I want to tell `manual` / `autovacuum` / `autovacuum_wraparound` apart on the left side of
         the screen, so that I do not have to read the query text in the rightmost column (which [009] scroll
         can push out of the window).
      4. As the pgcenter maintainer, I want green CI with a PG 19 cluster, so that the later 0.12.0 features
         ([016]-[019], all of which add PG 19 queries) are written against a verified base rather than blind.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 90
    status: "complete"
    value: |
      1. PG 19 cluster runs in the testing image on port 21919; `make test` and `testing/e2e.sh` are green
         against PG 14-19 in CI.
      2. Tests provably reach PG 19, not the PG 14 fallback: with cluster 21919 stopped, the PG 19 subtests
         SKIP rather than pass (guards internal/postgres/testing.go:35-37) — user, batch 4 Q4.
      3. Every `top` screen renders on live PG 19 with no errors and no panics (agent walk via tmux,
         screen dump per screen).
      4. progress_vacuum shows started_by and mode; progress_analyze shows started_by; progress_basebackup
         shows backup_type — populated, matching what psql returns for the same moment.
      5. Verification of the mechanism, not the value domain: `mode=failsafe` and
         `started_by=autovacuum_wraparound` are NOT deliberately reproduced (user, batch 5 Q2).
      6. On PG 14-18 the three screens are byte-identical to today (layout, Ncols, DiffIntvl).
      7. `report -P v|a|b` replay of a pre-0.12 archive is unchanged; existing goldens need no regeneration.
      8. overview.md / deployment.md / architecture.md list PG 19. README is NOT edited (user, batch 4 Q3).
    gaps: ""
    required: true

  edge_cases:
    score: 88
    status: "complete"
    value: |
      - RIGHT JOIN NULLs on progress_vacuum: a row matching `^vacuum` in pg_stat_activity with no
        pg_stat_progress_vacuum entry has NULL v.* — started_by/mode render blank. No coalesce: they sit
        OUTSIDE DiffIntvl, so the "NULL inside DiffIntvl aborts the sample" hazard ([005]/[006]) does not
        apply, and blank is the honest rendering (user, batch 3 Q3).
      - Wide value: `autovacuum_wraparound` is 21 chars; column widths come from data
