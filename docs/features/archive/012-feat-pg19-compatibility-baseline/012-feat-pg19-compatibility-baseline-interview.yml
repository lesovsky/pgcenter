notes: |
  ## PG 19 catalog check (postgresql.org/docs/devel/progress-reporting.html, checked 2026-07-25)

  Column names from the roadmap verified against the devel docs — all three exist with those exact names:

  - pg_stat_progress_vacuum.mode        : text, values `normal` | `aggressive` | `failsafe`
  - pg_stat_progress_vacuum.started_by  : text, values `manual` | `autovacuum` | `autovacuum_wraparound`
  - pg_stat_progress_analyze.started_by : text, values `manual` | `autovacuum`
  - pg_stat_progress_basebackup.backup_type : text, values `full` | `incremental`

  Detail the roadmap missed: `started_by` has THREE values on vacuum, not two — wraparound autovacuum is
  called out explicitly. Longest value `autovacuum_wraparound` is 21 chars, which is wide for a column
  placed next to pid at the head of the layout (internal/align sizes columns from the data). Raised in
  cycle 2 as a UI/UX question.

  Also present in devel but NOT in scope here: pg_stat_progress_vacuum.delay_time /
  pg_stat_progress_analyze.delay_time.

  Roadmap requires settling column sets against the live catalog, not release notes — the docs check above
  is a pre-verification; the live check happens on the PG 19 fixture during implementation.

  ## Free-form notes
  - Feature is the first of the 0.12.0 release and gates [016]-[019], all of which add PG 19 queries.
