      AC-9. Архив, охватывающий смену версии в середине записи, пересчитывает ширины
            колонок (техдолг [021]) — нет ни устаревшей раскладки, ни паники на нулевой
            ширине в report/printStatSample.
            СПОСОБ ПРОВЕРКИ (решение пользователя): синтетический архив, собранный в тесте
            из двух наборов сэмплов с разными version_num. Выбран вместо (б) «проверять
