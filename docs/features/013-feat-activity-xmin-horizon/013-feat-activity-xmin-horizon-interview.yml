phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      Подтверждены пользователем (q4.2) в финальной редакции.

      US-1. Как DBA, расследующий раздувание таблицы, я хочу видеть, какая сессия держит
      самый старый горизонт xmin, чтобы понять, кто мешает vacuum убирать мёртвые строки.
      Сценарий:
        1) запускаю `pgcenter top`, попадаю на экран activity;
        2) сортирую по колонке horizon_xacts по убыванию;
        3) верхняя строка — держатель самого старого горизонта;
        4) смотрю рядом xact_age — сколько эта транзакция уже висит по времени;
        5) смотрю state — работает она или зависла в `idle in transaction`;
        6) смотрю backend_xid — писала ли она (оценка цены pg_terminate_backend).

      US-2. Как DBA во время инцидента, я хочу отличать parallel workers от обычных
      бэкендов и видеть, к какому лидеру они относятся, чтобы не считать 30 строк за
      30 отдельных клиентов.
      Сценарий:
        1) на экране activity сортирую по колонке leader;
        2) лидер и все его воркеры идут подряд одной группой с одинаковым значением;
        3) у лидера leader == pid, у воркера leader == pid лидера;
        4) backend_type отдельно подтверждает, что строка — parallel worker.

      US-3. Как DBA, я хочу отличить писавшую транзакцию от только читающей, чтобы
      оценить цену pg_terminate_backend.
      Сценарий:
        1) нашёл держателя горизонта (US-1);
        2) backend_xid пуст → транзакция ничего не писала, убийство дёшево;
        3) backend_xid непуст → был откат работы, цена выше;
        4) КЛЮЧЕВОЕ: колонка query здесь НЕ помогает и вводит в заблуждение — у сессии в
           `idle in transaction` там лежит ПОСЛЕДНИЙ оператор, поэтому транзакция
           INSERT → SELECT → idle покажет невинный SELECT.
    gaps: ""
    required: true

  acceptance_criteria:
