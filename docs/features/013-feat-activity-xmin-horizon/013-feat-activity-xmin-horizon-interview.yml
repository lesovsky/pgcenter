      - horizon_xacts пуст, когда backend_xmin NULL (нет активного снапшота). Тоже норма.
      - ИСПРАВЛЕНО валидатором адекватности: служебные процессы (checkpointer, walwriter,
        bgwriter) на экране НЕ появляются вовсе. Существующий WHERE сравнивает с порогом
        xact_start и query_start, а у них оба NULL → условие даёт NULL → строка отсеивается.
        Первоначальная формулировка («присутствуют, leader == собственный pid») была
        фактически неверной.
      - Autovacuum worker появляется — он выполняет транзакции, поэтому xact_start у него
        выставлен. leader == собственный pid, horizon_xacts может быть непустым. Корректно:
        autovacuum тоже держит горизонт.
      - Параллельные воркеры наследуют снапшот лидера, поэтому при сортировке по
        horizon_xacts группа займёт подряд N+1 верхних строк с одинаковым значением. Не
        дефект: leader у них общий, группа читается как одна сущность.
      - Wraparound счётчика транзакций: age() устойчива к нему по построению. Это одна из
        причин, почему на activity выбрана age(), а не вычитание сырых 32-битных значений,
        как на replication.
      - PG 10–12: новых колонок нет вовсе, экран остаётся 14-колоночным. Никакого
        сообщения о недоступности не показываем — это не «фича недоступна», а просто
        старая раскладка.
      - PG 9.5/9.6: ветки не трогаются вообще.
      - Существующие фильтры экрана не конфликтуют: `I` добавляет `AND state != 'idle'`, а
        интересующее нас состояние — `idle in transaction`, оно этим фильтром НЕ убирается.
        `A` (порог возраста) фильтрует по xact_start/query_start; у сессии, держащей
        горизонт, xact_start выставлен, поэтому она проходит фильтр при достаточном
        возрасте.
      - Экран procpidstat не затронут: у него собственный 7-колоночный запрос к
        pg_stat_activity, он делит с activity только хоткеи фильтров I/A.
