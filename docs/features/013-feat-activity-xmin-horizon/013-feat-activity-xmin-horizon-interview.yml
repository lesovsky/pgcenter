  verification_strategy:
    score: 85
    status: "complete"
    value: |
      Решение пользователя (q4.4): приёмку выполняет агент по согласованным приёмочным
      тестам; стенд под это поднимает пользователь.

      Автоматическая часть:
      - `make test` — существующие golden-тесты report доказывают критерий обратной
        совместимости replay без единой правки (проверено эмпирически, см.
        testing_strategy).
      - Расширенный TestSelectStatActivityQuery — новая ветка PG 13+.
      - Новый юнит-тест сортировки по разреженной числовой колонке (РИСК-1).
      - `make lint`, `make vuln`.

      Стенд (уточнено пользователем q5): либо чистая ubuntu-24.04, где разворачивается
      образ pgcenter-testing, либо локально — образ уже есть в системе. Поднимать имеет
