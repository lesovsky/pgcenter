      табличным юнит-тестом селектора (см. AC-2).

      Ручная часть на стенде (PG 14–19):
      (а) сессия `BEGIN; SELECT ...;` и простой → непустой horizon_xacts, ПУСТОЙ backend_xid;
      (б) та же сессия после INSERT → backend_xid непустой;
      (в) `SET max_parallel_workers_per_gather = 4;` + тяжёлый seq scan → несколько строк с
