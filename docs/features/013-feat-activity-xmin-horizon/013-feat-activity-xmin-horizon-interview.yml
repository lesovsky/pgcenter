    required: true

  ui_ux_requirements:
    score: 85
    status: "complete"
    value: |
      ФИНАЛЬНЫЙ ПОРЯДОК КОЛОНОК на PG 13+ (17 колонок, было 14):

        0  pid
        1  leader          <- НОВАЯ
        2  cl_addr
        3  cl_port
        4  datname
        5  usename
        6  appname
        7  backend_type
        8  wait_etype
        9  wait_event
       10  state
       11  backend_xid     <- НОВАЯ
       12  horizon_xacts   <- НОВАЯ
       13  xact_age
       14  query_age
       15  change_age
       16  query

      Обоснование расстановки:
      - leader сразу за pid — родственные атрибуты идентичности (требование пользователя).
      - backend_xid → horizon_xacts → xact_age идут подряд, читаются как связка:
        «писала ли эта транзакция → на сколько транзакций назад держит горизонт →
        сколько уже висит по времени». Роадмап прямо требовал соседства horizon_xacts и
        xact_age.
      - query остаётся последней (широкая колонка; логика частично видимой последней
        колонки из [009]).
      ВАЖНО: порядок колонок не ловится НИ ОДНИМ тестом (прямая находка фичи 012), поэтому
      он зафиксирован здесь и должен попасть в tech-spec дословно.

      РЕШЕНО (q2/q3) — набор колонок сужен относительно роадмапа:
      - backend_xmin УДАЛЁН. Причина: экран `replication` уже принял ровно это решение —
        он показывает horizon_xacts/horizon_age, а сырой backend_xmin наружу не отдаёт
        (internal/query/replication.go:18-30), хотя в SQL использует. Для ранжирования
        «кто держит горизонт дольше» сырой xmin избыточен: horizon_xacts даёт тот же
        порядок в читаемом виде. Единственный сценарий, где нужен сырой xmin (сопоставить
        с `oldest xmin: N` из лога autovacuum), относится к осознанно отложенной в backlog
        роадмапа фиче «полный агрегат держателей горизонта».
      - backend_xid ОСТАВЛЕН. Он несёт сигнал, которого нет больше нигде на экране:
        транзакция писала или только читала. Колонка `query` этот вопрос НЕ закрывает и
        активно вводит в заблуждение: у сессии в `idle in transaction` там лежит ПОСЛЕДНИЙ
        оператор, поэтому транзакция INSERT → SELECT → idle покажет невинный SELECT.
        Операционная ценность — решение «можно ли убить»: долгий SELECT убивается без
        последствий, батч с записанными строками означает откат.
        Честная оговорка: смысл несёт факт наличия значения, а не само значение.

      ИМЯ ГРУППИРОВОЧНОЙ КОЛОНКИ — `leader`. Решение принято в ДВА захода:
      - q3: выбран `pgroup` (от «parallel group»), отвергнут `group_pid` как длинный.
        Обоснование было ЧИСТО СТИЛИСТИЧЕСКИМ — «короче, в стиле appname/cl_addr».
      - q6: ПЕРЕСМОТРЕНО после разбора dev-customer. Он справедливо указал, что имя ни разу
        не проверялось по главному критерию — читается ли оно DBA, который НЕ открывал
        документацию, а это ровно целевой пользователь: во время инцидента доки не читают.
        `pgroup` одинаково правдоподобно читается как «process group» (unix-термин,
        означающий совсем другое) и как «parallel group». Единственной митигацией была
        оговорка в describe.go — то есть ровно там, куда в инциденте не пойдут.
        Рассмотрены: `leader`, `par_leader` (10 символов ширины), `leader_grp`, оставить
        `pgroup`. ВЫБРАН `leader` — короткий, не пересекается с unix-терминологией,
        семантика «кто здесь главный» угадывается без документации.
        Ширина: max(len("leader"), 8) = 8, то есть минимальная.
    gaps: ""
    required: true

  risks:
    score: 85
    status: "complete"
    value: |
      РИСК-1 (главный, найден в коде, ВХОДИТ В СКОУП ФИКСОМ — решение пользователя q4.1).
      Сортировка по разреженной числовой колонке недетерминированно ломается.
      PGresult.sort (internal/stat/postgres.go:663) выбирает режим сортировки, посмотрев
      ТОЛЬКО на первую строку: `sample := r.Values[0][key].String` (:668). У horizon_xacts и
      backend_xid большинство ячеек пусты (по нашему же решению «NULL рендерим пусто»).
      Если пуста первая строка: ParseFloat("") падает, parseDuration("") тоже падает
      (SplitN даёт 1 часть вместо 3, :725) → проваливаемся в лексикографическую сортировку
      (:694), где "9" > "1000000".
      Первая строка — бэкенд с наибольшим pid (SQL идёт ORDER BY pid DESC), держит ли он
      xmin — случайность. С точки зрения DBA сортировка иногда работает, иногда молча врёт.
      Бьёт ровно в главный поток US-1.
      Баг ПРЕДСУЩЕСТВУЮЩИЙ (cl_port тоже числовая и пуста на unix-socket соединениях), но
      сегодня недостижим на практике, потому что по cl_port никто не сортирует.
      МИТИГАЦИЯ: брать образец не из строки 0, а из первой НЕПУСТОЙ ячейки колонки. Пустые
      тогда парсятся в 0 (ошибка уже игнорируется) и при сортировке по убыванию оседают
      вниз — сессии без горизонта уходят под виновника, что и требуется. Если непустых нет
      вовсе — остаётся строковая сортировка, вреда нет. Правка в postgres.go:668 +
      юнит-тест на разреженную колонку.

      РИСК-2. Пустая колонка читается как «горизонт никто не держит», хотя причин пустоты
      три: (а) сессия действительно не держит горизонт; (б) горизонт держит источник, не
      представленный в pg_stat_activity — слот репликации, prepared transaction, standby
      feedback; (в) у пользователя нет прав видеть чужие сессии.
      По (в): в коде НЕТ обработки привилегий для pg_stat_activity (проверено grep'ом:
      42501 обрабатывается только в overview.go для pg_ls_dir). pg_stat_activity при
      нехватке прав не отдаёт ошибку — он молча отдаёт NULL, поэтому ловить нечего.
      МИТИГАЦИЯ: оговорка в report/describe.go (решение пользователя q4.3), без кода.
      Полный агрегат по всем четырём источникам горизонта — осознанно отложен роадмапом
      в backlog.

      РИСК-3. Ширина экрана. internal/align/align.go:36 задаёт минимум ширины колонки как
      max(len(colname), 8), поэтому horizon_xacts займёт 13 символов, backend_xid — 11,
      leader — 8, итого +32 символа к строке, преимущественно пустых.
      МИТИГАЦИЯ: не требуется. Горизонтальный скролл [009] снял ограничение ширины — это
      прямо записано в роадмапе как причина, почему расширение activity стало возможно
      именно сейчас.

      РИСК-4. Порядок колонок легко переставить незаметно (прямая находка фичи 012: ни один
      тест этого не ловил).
      МИТИГАЦИЯ (итог q7.B + q8): оба канала закрыты тестами — порядок описаний в
      report/describe.go по образцу Test_describeProgressColumnOrder, порядок колонок в
      самом SQL — сверкой имён и последовательности с rows.FieldDescriptions() живого
      сервера на PG 14–19. ОСТАТОЧНЫЙ РИСК: живых кластеров PG 12/13 нет, там порядок
      держится только на дословной записи в ui_ux_requirements.

      РИСК-5 (найден валидатором адекватности). Правка выбора режима сортировки — изменение
      ОБЩЕГО движка, а не кода экрана activity. Она меняет поведение везде, где колонка
      разрежена по другой причине (например, xact_age у простаивающих сессий начнёт
      сортироваться как длительность, а не как строка). Это исправление, а не регрессия, но
      радиус больше остальной фичи. И существеннее: эмпирическое измерение «golden-тесты
      проходят без правок» сделано на конфигурации БЕЗ этой правки.
      МИТИГАЦИЯ: перепрогнать эталонные отчёты уже с правкой сортировки.

      РИСК-6 (найден валидатором адекватности). Сортировка ПО ВОЗРАСТАНИЮ была не
      определена: пустые ячейки парсятся в 0 и всплыли бы наверх, смешавшись с настоящим
      horizon_xacts = 0 — прямое нарушение собственного правила «пусто — это не ноль».
      МИТИГАЦИЯ: пустые уходят в конец списка при ОБОИХ направлениях сортировки. Строки без
      значения не принадлежат ни началу, ни концу числового ряда.
    gaps: ""
    required: true

  technical_decisions:
    score: 85
    status: "complete"
    value: |
      1. `leader` = `coalesce(leader_pid, pid)`, НЕ сырой leader_pid.
         Причина: в PostgreSQL leader_pid равен NULL и у самого лидера тоже — он непустой
         только у воркеров. Поэтому сортировка по сырому leader_pid НЕ достигает заявленной
         роадмапом цели «воркеры рядом с лидером»: лидер уезжает в кучу NULL вместе с
         обычными бэкендами. У coalesce-варианта лидер и все его воркеры имеют одно и то же
         значение, сортировка склеивает группу; обычные бэкенды получают собственный pid и
         никому не мешают.
         ТРЕБОВАНИЕ ПОЛЬЗОВАТЕЛЯ: оговорка в документации обязательна — иначе колонка
         выглядит как сырой leader_pid и вводит в заблуждение.
         Место оговорки — ТОЛЬКО `report/describe.go`. `internal/stat/help.go` — мёртвый код
         (экспортируемые константы PgStat*Description без единой ссылки в репозитории; он
         вдобавок протух: колонку, которую живой describe.go:75 называет horizon_xacts, он
         всё ещё зовёт `xact_age*`).

      2. `horizon_xacts` на activity = `age(backend_xmin)`.
         Это ЕДИНСТВЕННАЯ доступная формула: `pg_last_committed_xact()` (которой пользуется
         экран replication) падает при выключенном track_commit_timestamp.
         ПРИНЯТОЕ РАСХОЖДЕНИЕ: после фичи две колонки с одним именем horizon_xacts будут
         считаться разными выражениями — на replication от последней закоммиченной
         транзакции (может быть отрицательной, требует GUC, не переживает wraparound), на
         activity от текущего счётчика xid (неотрицательная, GUC не требует, wraparound-safe).
         Формула на activity строго честнее. РЕШЕНО (q3): формулу на replication НЕ
         переписывать (другой экран, другая фича), расхождение задокументировать в
         describe.go.

      3. `view.New()` seed для activity НЕ трогаем (остаётся PgStatActivityDefault/Ncols=14).
         Измерено исследователем: при таком выборе полный прогон internal/view,
         internal/query, report, top, record, internal/align — зелёный. Если поднять seed до
         17/18, падают ровно два теста: top/config_view_test.go:18 и :48. Реальное значение
         всё равно проставляет Configure (internal/view/view.go:375). Тот же выбор сделала
         фича 012.

      4. Явный `::text` на xid-колонках — как уже сделано в replication.go:28.
         Цепочка pgx v5.9.2 прослежена: Uint32Codec.PlanScan не знает *sql.NullString →
         scanPlanCodecSQLScanner → DecodeDatabaseSQLValue, NULL даёт {String:"", Valid:false}.
         Решение «NULL рендерим пусто, никогда 0» выполняется ТЕМ, ЧТО МЫ НЕ ДЕЛАЕМ coalesce;
         добавление coalesce(backend_xid,0) его бы нарушило. Урок coalesce из
         replication_slots.go здесь НЕ применяется — он про диффуемые колонки, а у activity
         DiffIntvl={0,0}.

      5. Техдолг [021] берётся В ЭТУ ФИЧУ (решение пользователя, q3).
         Причина: фича добавляет ему новую границу смены ширины (сейчас activity меняет
         ширину на 9.6→10, добавляем 12→13). И он опаснее, чем записано в реестре: в
         report/printStatSample (report.go:566-570) НЕТ guard'а на нулевую ширину, который
         есть в top/printDataCell (stat.go:1003-1008) — там это паника на `[:-1]`, а не
         косметика. Фикс — одна строка `v.Aligned = false` рядом с Configure.

      6. Техдолг [020] НЕ трогаем — через activity недостижим: DiffIntvl={0,0} уводит
         calculateDelta (postgres.go:590) в ветку `delta = curr`, diff() не вызывается.
    required: false

