            Живая проверка возможна на PG 14–19 (кластеры фикстуры).
      AC-2. На PG 10–12 селектор возвращает прежний запрос и Ncols=14.
            ВАЖНО: проверяется ТОЛЬКО табличным юнит-тестом SelectStatActivityQuery, живьём
            непроверяем — в образе pgcenter-testing есть только PG 14–19
            (testing/Dockerfile:30-39). PG 13 и PG 10–12 присутствуют в порт-мапе
