# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
phase1_feature_overview:

  feature_description:
    score: 90
    status: "complete"
    value: |
      ФИНАЛЬНЫЙ СОСТАВ: добавить ТРИ колонки в существующий view `activity` (новых экранов
      нет):
      - `leader`        — группировка параллельного запроса, coalesce(leader_pid, pid).
      - `backend_xid`   — писала ли транзакция (смысл несёт факт наличия значения).
      - `horizon_xacts` — на сколько транзакций назад сессия держит горизонт xmin,
                          age(backend_xmin).
      Источник скоупа: docs/roadmap-0.12.0.md, раздел [013]. Закрывает issue #148.

      ОТЛИЧИЯ ОТ ИСХОДНОЙ ПОСТАНОВКИ РОАДМАПА (оба — решения пользователя, q2/q3):
      - Роадмап требовал четыре колонки, включая сырой `backend_xmin`. Он УДАЛЁН как
        избыточный при наличии horizon_xacts (обоснование — в ui_ux_requirements).
      - Роадмап требовал сырой `leader_pid`. Вместо него `leader` = coalesce(leader_pid,
        pid), иначе заявленная роадмапом цель не достигается вовсе (обоснование — в
        technical_decisions п.1).

      РЕШЕНО (q1): колонка называется horizon_xacts, а НЕ роадмапное xmin_age — ровно тот же
      термин, которым экран `replication` уже называет эту величину. Живые прецеденты:
      internal/query/replication.go:28 и report/describe.go:75.
      ВНИМАНИЕ: internal/stat/help.go:59 прецедентом НЕ является — это мёртвый код, и он
      вдобавок протух, называя ту же колонку `xact_age*`. Ссылаться на него нельзя.
    gaps: ""
    required: true

  user_problem:
    score: 85
    status: "complete"
    value: |
      Сегодня экран activity не может ответить на вопрос «держит ли эта idle-in-transaction
      сессия горизонт xmin и блокирует ли vacuum?» — для этого нужно уходить в psql.
      Второе: на PG 14+ parallel workers засоряют экран, и их нельзя привязать к лидеру.
      Целевая аудитория — практикующий DBA во время инцидента.
    gaps: ""
    required: true

  target_users:
    score: 85
    status: "complete"
    value: |
      Практикующий PostgreSQL DBA, разбирающий инцидент или расследующий раздувание таблиц /
      незапускающийся vacuum. Тот же профиль, что у всего релиза 0.12.0.
    gaps: ""
    required: false

  success_criteria:
    score: 85
    status: "complete"
    value: |
      (а) На PG 14–19 экран `activity` показывает 4 новые колонки; NULL рендерится пустым,
          никогда не `0`.
      (б) `report -A` на архиве, записанном ДО 0.12 (старое число колонок), воспроизводится
          без ошибок и без перекоса колонок — обратная совместимость replay.
      (в) `report -A` на новом архиве показывает новые колонки.
      Принято пользователем без правок (q1.4).
    gaps: ""
    required: true

  constraints:
    score: 85
    status: "complete"
    value: |
      Зафиксировано роадмапом (не переоткрывать):
      - xmin_age только в транзакциях, без wall-clock. Честной конверсии xid-дистанции во
        время нет; временнoe измерение даёт уже существующая колонка xact_age.
        pg_xact_commit_timestamp(backend_xmin) рассмотрен и отвергнут — требует
        track_commit_timestamp=on, который почти никогда не включён.
      - leader_pid — только колонка, без тоггла «скрыть parallel workers» (это дублировало бы
        существующую машинерию фильтров I/A ради узкого случая).
      - backend_xid/backend_xmin NULL для большинства строк (нет назначенного xid,
        не client backend) — рендерить пусто, никогда 0.
      Код: SelectStatActivityQuery (internal/query/activity.go) сейчас ветвится только на
      9.5/9.6/default, 14 колонок в default. leader_pid появился в PG 13 → нужна новая ветка.

      РЕШЕНО (q1.1) — wall-clock `horizon_age` на activity НЕ делаем. Важно: причина не та,
      что записана в роадмапе. Роадмап утверждал «pg_xact_commit_timestamp отвергнут, потому
      что требует track_commit_timestamp=on» — но механизм условного расширенного запроса в
      коде УЖЕ существует и работает: SelectStatReplicationQuery(version, track bool) отдаёт
      PgStatReplicationExtended с horizon_xacts+horizon_age, когда GUC включён; сам `track`
      вычисляется в internal/view/view.go:Configure() из opts.GucTrackCommitTS. То есть
      «этого нет в коде» — неверный аргумент.
      Действительная причина отказа: на `replication` строк единицы (число стендбаев), а на
      `activity` — сотни; и добавление второго GUC-зависимого экрана удваивает матрицу
      «версия × track» в тестах и в replay report -A (архив хранит track_commit_timestamp в
      метаданных). Цена не оправдана для сигнала, который почти всегда недоступен.

      РЕШЕНО (q1.3) — ветвление по версиям: новая ветка PG 13+ становится default и несёт
      полный набор из 4 новых колонок; существующий PgStatActivityDefault остаётся веткой
      для PG 10–12 без новых колонок. Третью ветку ради EOL-версий (backend_xid/backend_xmin
      есть с 9.4, а leader_pid только с 13) не делаем — эти версии даже не тестируются.
    gaps: "Влияние на ширину экрана/горизонтальный скролл — Цикл 2"
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      Размер фичи — M (принято пользователем).

      Критерий (б) — обратная совместимость replay — УЖЕ ПОКРЫТ существующим тестом, это
      проверено эмпирически, а не рассуждением. Исследователь временно вкрутил ветку PG 13+
      на 18 колонок и прогнал `go test -count=1 ./report/...` против
      report/testdata/pgcenter.stat.golden.tar (запись PG 14, version_num=140000, activity в
      14 колонок) → ok, все пять activity-голденов совпали байт в байт.
      Причина в коде: report/ вообще не читает view.Ncols (единственные обращения к Ncols в
      report/report.go — res.Ncols на строках 360 и 395, обе про procpidstat). Ширины
      считаются из записанного PGresult (align.SetAlign в formatStatSample,
      report.go:476-486), печать идёт по res.Cols (report.go:513, 564), сортировка — по
      именам колонок из архива (report.go:296-302). Configure от версии архива вызывается
      (report.go:258-265, путь фичи [008]), но для activity переписывает только QueryTmpl
      (в report мёртвый) и Ncols (никем не читаемый).
      => Отдельная фикстура-архив НЕ нужна.

      Ломающихся тестов ноль при выборе «не трогать seed в view.New()» (см.
      technical_decisions п.3). TestNew / TestView_VersionOK / Test_filterViews считают
      VIEWS, а не колонки — не задеты, подтверждено прогоном.

      Что нужно НАПИСАТЬ/РАСШИРИТЬ:
      - TestSelectStatActivityQuery (activity_test.go:10-26) — расширить таблицу новой
        веткой. Сейчас он НЕ ломается (в таблице только 90500/90600/100000, а 100000
        остаётся на старой ветке), поэтому это расширение, а не починка. Это ЕДИНСТВЕННАЯ
        защита от ошибки в границе 12→13 (см. AC-2) — добавить строки и на 120000
        (старая ветка), и на 130000 (новая), чтобы граница была зафиксирована с обеих сторон.
      - Тест на сортировку по разреженной числовой колонке (см. risks РИСК-1).

      - РЕШЕНО (q7.A) — АПГРЕЙД Test_StatActivityQueries (activity_test.go:28-50) до
        реальной проверки числа колонок живым сервером. Сейчас тест делает
        `tmpl, _ := SelectStatActivityQuery(version)` — ВЫБРАСЫВАЕТ Ncols — и затем
        `conn.Exec(q)`, то есть проверяет только «запрос не падает»; сколько колонок сервер
        реально вернул, не сверяется никогда. Переделать на `conn.Query` +
        `assert.Len(rows.FieldDescriptions(), wantNcols)` по образцу bgwriter_test.go и
        progress_vacuum_test.go из фичи 012.
        Список версий в этом тесте УЖЕ полный (90500…190000), расширять не нужно.
        Почему это важно именно здесь: вся фича построена на честном разделении «что
        реально проверено живым кластером, а что нет» (AC-2 отдельно помечен как
        непроверяемый). Без апгрейда утверждение «17 колонок на PG 14–19» осталось бы
        ЗАЯВЛЕНИЕМ, а не измерением, хотя кластеры доступны и проверка стоит копейки.

      - РЕШЕНО (q7.B) — тест порядка строк описания в report/describe.go по образцу
        Test_describeProgressColumnOrder (report_test.go:1216-1252, фича 012). У РИСК-3 два
        канала: порядок в SQL-запросе и порядок описаний в describe.go. Этот тест закрывает
        второй почти даром; SQL-порядок так не покрыть, он остаётся за приёмкой глазами.

      - Живая проверка на кластерах PG 14–19: NULL рендерится пусто, leader склеивает
        группу параллельного запроса.

      ОТКЛОНЕНО (q7.D): предложение перепривязать assert.NotEqual(t, 19,
      s.Pgstat.Result.Ncols) в internal/stat/stat_test.go:442 на проверку по именам колонок.
      Мотив был «activity окажется в одной колонке от 19-колоночного procpidstat», но он
      посчитан из промежуточного плана на 18 колонок. Финальный состав — 17, дистанция два,
      guard остаётся осмысленным.
