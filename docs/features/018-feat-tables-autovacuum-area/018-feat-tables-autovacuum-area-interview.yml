            руками, другим инструментом или pg_stat_reset_single_table_counters()
            по одной таблице он не видит; stats_age читает правду сервера.
            Не отвергнут как идея — но это отдельная фича, не замена этой.
      disposition_of_finding_3: |
        ОТКЛОНЕНО. Релиз называется "PostgreSQL 19 + troubleshooting", и решение делать
        PG-19-часть против беты записано в роадмапе явно — чтобы pgcenter был готов
        в день GA, а не через квартал после. Отложенная ценность здесь замысел,
        а не побочный эффект. Принять находку — значит пересматривать весь релиз,
        а не фичу 018.

# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
phase1_feature_overview:

  feature_description:
    score: 85
    status: "complete"
    value: |
      Один проход по области tables/indexes/functions релиза 0.12.0, три части:
      1. Новый экран `autovacuum_scores` (PG 19+) над pg_stat_autovacuum_scores.
         Отображаемые колонки: relation, score, xid_score, mxid_score, vacuum_score,
         vacuum_insert_score, analyze_score, do_vacuum, do_analyze, for_wraparound
         (+ обсуждается колонка абсолютного объёма мёртвых строк). Score округляются
         до 2 знаков. Сортировка по умолчанию — score DESC. Каталожные схемы скрыты/
         показаны существующим ViewType-тумблером (`,`), реализованным вручную в запросе.
         Цикл `t` (tables -> autovacuum_scores), меню `T` из двух пунктов; пункт
         autovacuum_scores всегда присутствует и помечается недоступным на PG < 19.
      2. Колонка stats_age на экранах tables и indexes из нового PG 19 stats_reset
         (источник — pg_stat_*, алиас t.). Экран functions исключён из объёма
         на ревью заказчика (вопрос 22, вариант C).
      3. NotRecordable: true для autovacuum_scores по cross-cutting политике релиза.
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: |
      Первая половина. Сегодня на вопрос "почему автовакуум не приходит к этой таблице и
      когда придёт" DBA отвечает вручную: собирает n_dead_tup, reltuples, GUC-и порогов,
      per-table reloptions — и считает формулу в уме. PG 19 отдаёт арифметику самого
      автовакуума. Измерено на живом PG 19beta2:
        vacuum_score = n_dead_tup / (autovacuum_vacuum_threshold
                                     + autovacuum_vacuum_scale_factor * reltuples)
      (совпало до 4 знаков на трёх таблицах), а score = greatest(пяти под-скоров), 116/116
      строк. То есть score >= 1 означает "порог перейдён".
      Отдельный, и вероятно главный, сценарий: do_vacuum/do_analyze — это фактический
      вердикт, и он расходится со score. Измерено: ALTER TABLE ... SET
      (autovacuum_enabled = false) оставляет score 12.469 и vacuum_score 1.248, но
      переключает do_vacuum t -> f. Именно эта пара на одном экране отвечает "почему
      не вакуумится" — по отдельности ни одна из колонок этого не говорит.

      Вторая половина. stats_age. ФОРМУЛИРОВКА ИСПРАВЛЕНА (вопрос 22): изначально я
      утверждал, что после `Q` (top/reset.go:17 -> pg_stat_reset()) нет обратной связи
      вообще — это неверно, top/reset.go:15,36 печатает "Reset statistics." в cmdline.
      Точная формулировка: обратная связь есть, но ТРАНЗИЕНТНАЯ (двухсекундный таймер
      композитора). Спросить ПОЗЖЕ "а когда я сбрасывал" сегодня невозможно, а без этого
      счётчики, сброшенные три минуты назад, и счётчики за 200 дней читаются одинаково.
      На нетронутом кластере колонка пуста во всех строках, и это честный рендер
      "никогда не сбрасывали".
      Отдельно про indexes (почему он остался в объёме, а functions нет): idx_scan без
      "за какой период" — счётчик, по которому принимают решение дропнуть индекс,
      и цена ошибки там высокая.
    gaps: ""
    required: true

  target_users:
    score: 75
    status: "partial"
    value: |
      Практикующий PostgreSQL DBA (audience lens роадмапа 0.12.0): разбор инцидента
      "автовакуум отстаёт / таблица пухнет", и рабочий цикл "сбросил статистику -> смотрю,
      как набирается".
    gaps: ""
    required: false

  success_criteria:
    score: 85
    status: "complete"
    value: |
      - На PG 19 экран autovacuum_scores отвечает на "почему эта таблица не вакуумится"
        БЕЗ выхода в psql: пара "score выше порога + do_vacuum=false" читается с экрана.
      - На PG 14-18 фича ничего не ухудшает: `t` и `T` ведут себя ровно как сегодня,
        плюс явная пометка недоступности в меню.
      - Всё проверяемо: автоматическая часть — на фикстурах PG 14-19 в CI-образе,
        ручная — прогон на стенде.
    gaps: ""
    required: true

  constraints:
    score: 80
    status: "partial"
    value: |
      - MinRequiredVersion PostgresV19 для autovacuum_scores. Version guard
        (internal/stat/stat.go:317) возвращает ОШИБКУ каждый тик, а не подпись — поэтому
        цикл `t` и меню `T` должны быть version-aware, иначе на PG 14-18 (пять из шести
        поддерживаемых версий) пользователь попадает на вечно ошибающийся экран.
      - Привилегий не требуется: обычная роль без pg_monitor и без superuser читает
        pg_stat_autovacuum_scores целиком. В отличие от wal/archiver экран не падает под
        непривилегированной ролью.
      - Цена запроса измерена и вопросом не является: 5.5 мс на 5116 отношений против
        6.1 мс у pg_stat_all_tables, который pgcenter и так дёргает раз в секунду.
        Тротлинг не нужен; кросс-принцип "не усугублять инцидент" соблюдается по факту.
      - Набор колонок сверен с живым каталогом PG 19beta2, не с release notes.
        Каталог может поехать в beta3/RC.
    gaps: "Ripple по count-based тестам не перечислен (ждём code-research)"
    required: true

  testing_strategy:
    score: 85
    status: "complete"
    value: |
      Интеграционные тесты против фикстур PG 14-19 обязательны — иначе PG 19-ветки
      не проверены (прогон в CI-образе lesovsky/pgcenter-testing:0.0.11, кластеры
      21914-21919, см. local-test-fixtures).
      E2E — ручной прогон на стенде с tmux/capture-pane.
      Отдельная фикстура для wraparound (notes 28-30): ALTER TABLE ... SET
      (toast.autovacuum_freeze_max_age = 100000) + процедура с COMMIT в цикле на 120k
      транзакций, 262 мс. Флагованное отношение ОБЯЗАНО лежать в системной схеме,
      иначе тест проходит и без escape-hatch.
      Обязательство против дрейфа каталога PG 19 beta: locked-тест на список имён колонок
      autovacuum_scores по образцу archiver_test.go — дрейф каталога в beta3/RC должен
      ловиться явно, а не тихо портить экран.
      Замер цены запроса выполнен на этапе интервью и в критерии приёмки НЕ выносится
      (решение пользователя: вариантов оптимизации кроме тротлинга всё равно нет).
      Размер фичи: L. ОБНОВЛЕНО после реза объёма (вопрос 22): вторая половина — ДВА
      существующих экрана (tables, indexes), не три; functions исключён, его report-layout
      и запрос не трогаются вообще.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
phase2_user_experience:

  user_stories:
    score: 80
    status: "partial"
    value: |
      S1. "Таблица пухнет, а автовакуум не идёт". DBA жмёт `t`, затем `t` ещё раз ->
          autovacuum_scores, сортировка по score DESC уже по умолчанию. Таблица вверху:
          score 12.47, vacuum_score 1.25, do_vacuum = false. Вывод: порог перейдён,
          но автовакуум сюда не придёт — причина в reloption или GUC, а не в отставании.
          Раньше этот вывод требовал psql и ручного счёта формулы.
      S2. "Кто следующий в очереди и сколько там работы". Экран отсортирован по score DESC.
          Наверху big1: score 12.47, vacuum_score 1.25, dead_total 50 000, do_vacuum = true.
          Ниже small1: score 2.67, vacuum_score 0.86, dead_total 60. Обе около порога
          по score, но объём работы отличается на три порядка — и виден только в
          dead_total. Вывод DBA: big1 стоит вакуумить руками в окно обслуживания,
          small1 подождёт автовакуума. Без dead_total этот вывод из экрана не следует.
      S3. "Сбросил статистику — с какого момента считаем". До сброса stats_age пуст во всех
          строках (кластер, где статистику не сбрасывали, — 0 из 116). DBA жмёт `Q`,
          cmdline показывает транзиентное "Reset statistics.", затем `t`: stats_age
          заполняется во ВСЕХ строках одинаковым значением (00:00:03), потому что
          pg_stat_reset() ставит один timestamp на всю базу. Дальше значение растёт
          тик за тиком. Через час DBA возвращается к экрану и видит 01:00:12 — то есть
          отвечает на "с какого момента эти счётчики", чего транзиентное сообщение
          дать не может.
      S4. "Wraparound в тоасте". Решено в вопросе 13 (вариант A) — поведение принятое,
          не обсуждаемое: строка с for_wraparound = true видна в режиме user ВСЕГДА,
          даже когда остальные системные строки скрыты. DBA работает в обычном режиме
          user, и подъезжающий к wraparound pg_toast.pg_toast_16532 всплывает сам —
          со score, поднятым через xid_score, то есть в верхней части экрана.
          Проверено на фикстуре: ровно одна такая строка, режим user без escape-hatch
          даёт 1 строку, с ним — 2.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 85
    status: "complete"
    value: |
      Согласованный скелет, ориентир ~35 критериев:
      - новый экран (~10): набор и порядок 11 колонок, округление до 2 знаков,
        ORDER BY score DESC, LEFT JOIN и колонка dead_total, фильтр по трём системным схемам,
        escape-hatch for_wraparound.
      - навигация (~5): цикл `t`, меню `T`, подпись ровно один раз на обоих путях входа
        (проверка, поймавшая дефект в 017).
      - версии (~5): PG 19 — экран есть; PG 14-18 — `t` как сегодня, пункт меню виден
        и помечен, Enter по нему не уводит на ошибающийся экран.
      - stats_age на ДВУХ экранах, tables и indexes (~5): колонка последняя, вне DiffIntvl,
        пустая при NULL, Ncols/DiffIntvl версионно-зависимы.
        Плюс негативный критерий: экран functions НЕ изменился (страховка от того,
        что исполнитель "заодно" добавит колонку и туда).
      - report (~3): воспроизведение архива через границу PG 18 -> PG 19.
      - record (~2): вью отбрасывается; make test зелёный на фикстуре PG 17
        (см. ловушку recorder_test.go:30).
      - документация (~4): help, features-catalog.md, overview.md, release notes.
    gaps: ""
    required: true

  edge_cases:
    score: 30
    status: "partial"
    value: |
      - PG 14-18: autovacuum_scores недоступен. Цикл `t` ведёт себя как сегодня; пункт меню
        `T` присутствует, но помечен недоступным, и выбор его не должен уводить на
        ошибающийся экран.
      - stats_age пуст во всех строках на кластере, где статистику никогда не сбрасывали
        (0 из 116 отношений имеют значение) — это норма, а не сбой.
      - После pg_stat_reset() значение одинаково во всех строках (равно
        pg_stat_database.stats_reset). Прецедент повторяющейся колонки есть — stat_io col 15.
      - pg_stat_user_functions пуст без track_functions — это и стало причиной исключить
        экран functions из объёма (вопрос 22, вариант C).
      - pg_toast/pg_catalog строки: скрыты в режиме ViewType=user, видны в all
        (wraparound часто именно в тоастах).
      - Партиционирование: партиционированный РОДИТЕЛЬ (relkind 'p') отсутствует в
        pg_stat_autovacuum_scores, но присутствует в pg_stat_all_tables (проверено).
        Асимметрия односторонняя, LEFT JOIN из scores наружу её поглощает; родитель
        просто не показывается — и это правильно, хранилища у него нет. Партиции-дети —
        обычные relkind 'r', видны по отдельности.
      - Строка с for_wraparound = true в системной схеме видна в режиме user всегда
        (escape-hatch, вариант A) — единственное отступление от однородности фильтра.
      - Пустой экран — без пояснения, как у progress_*.
      - reltuples = -1 (отношение ни разу не анализировали) — ИЗМЕРЕНО, осознанное
        допущение, не открытый вопрос: PostgreSQL считает неизвестный reltuples нулём,
        поэтому знаменатель вырождается в один порог. Замер: dead 3333, reltuples -1 ->
        vacuum_score 66.66 (= 3333/50), score 266.66, do_vacuum = true. Такие отношения
        всплывают в верх экрана — и это правильное поведение, им действительно нужно
        внимание. Отрицательных значений и NaN во всём кластере ноль (0/0/115).
      - Очень длинные имена отношений — поведение существующее: relation это колонка 0,
        заморожена горизонтальным скроллом [009].
    gaps: ""
    required: true

  error_scenarios:
    score: 85
    status: "complete"
    value: |
      Решение: специальной обработки не требуется НИГДЕ, всё покрыто существующим поведением.
      - Запрос упал (например, каталог поехал в beta3) -> version guard/collector отдают
        ошибку, printDbstat (top/stat.go:793-802) заменяет всю область таблицы на ERROR
        каждый тик. Как на любом экране.
      - Отношение исчезло между тиками -> строка просто пропадает; матчить нечего,
        DiffIntvl {0,0}.
      - dead пуст из-за LEFT JOIN -> пустая ячейка (по замеру такого не бывает: строк,
        которые есть в scores и отсутствуют в pg_stat_all_tables, ноль даже при
        партиционировании).
      - Пустой экран (режим user, пользовательских таблиц нет) -> пустая таблица
        БЕЗ пояснения, как у progress_*, которые пусты почти всегда. Решение пользователя.
      - PG 14-18: экран недоступен; version guard не должен достигаться из UI вообще —
        цикл и меню делаются version-aware именно ради этого.
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      Автоматическая часть — фикстуры PG 14-19 в CI-образе lesovsky/pgcenter-testing:0.0.11
      (кластеры 21914-21919), плюс отдельная фикстура для wraparound (см. notes 28-30):
      ALTER TABLE ... SET (toast.autovacuum_freeze_max_age = 100000) + процедура,
      сжигающая 120k транзакций через COMMIT в цикле — 262 мс, ровно одна флагованная
      строка, и она в pg_toast. Проверка различающая: без escape-hatch режим user даёт
      1 строку, с ним 2.
      Ручная часть — прогон на стенде (tmux, capture-pane), список из вопроса 15:
      1) `t` `t` на PG 19, подпись ровно один раз на обоих путях входа;
      2) `t` на PG 18 — отличий от master-бинарника нет (A/B со вторым бинарником);
      3) `T` на PG 18 — пункт виден, помечен, Enter не уводит на ошибающийся экран;
      4) `,` переключает user/all, каталожные строки появляются и исчезают;
      5) `Q`, затем `t` — stats_age заполнился одинаковым значением во всех строках;
      6) узкий терминал (-x 60) — горизонтальный скролл по 11 колонкам, relation заморожен.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 60
    status: "partial"
    value: |
      Новый экран autovacuum_scores:
      - relation (склейка schemaname||'.'||relname по идиоме tables.go), score, xid_score,
        mxid_score, vacuum_score, vacuum_insert_score, analyze_score, do_vacuum, do_analyze,
        for_wraparound. relid не показываем.
      - score округляются до 2 знаков. Измерение подтверждает достаточность: интересный
        диапазон — около и выше 1.0, каталожный шум — 0.00-0.16.
      - Одиннадцатая колонка: dead_total — абсолютный n_dead_tup из pg_stat_all_tables,
        LEFT JOIN по relid. Не диффуется (DiffIntvl {0,0} на этом экране).
      - OrderKey = score, DESC.
      - Каталожные схемы — существующий ViewType-тумблер (`,`). В каталоге присутствуют
        ровно три системные схемы: information_schema, pg_catalog, pg_toast (проверено).
      - Навигация: цикл `t`, меню `T` с двумя пунктами; второй помечается недоступным
        на PG < 19.
      - Рендер булевых: идиома в коде уже есть — `s.active::text AS active`
        (internal/query/replication_slots.go:16), то есть "true"/"false", а не "t"/"f".
      - Округление: идиома `round(x, 2)` / `round(...)::text` уже используется
        (wal.go:7, functions.go:9, progress_vacuum.go:8) — делается в SQL, не в Go.
    gaps: "Escape-hatch для for_wraparound (вопрос 13); ширина relation; поведение пустого экрана"
    required: true

  risks:
    score: 35
    status: "partial"
    value: |
      - Каталог PG 19 может измениться в beta3/RC — набор колонок сверять повторно.
      - Version-aware цикл и меню — новый паттерн в top/, объём прироста не оценён
        (ждём code-research).
      - Цена запроса: риск снят измерением (5.5 мс на 5116 отношений).
      - Привилегии: риск снят (роль без pg_monitor читает вью).
      - Ловушка record/recorder_test.go:30 — неотфильтрованная карта вью передаётся
        в tarRecorder.collect против фикстуры PG 17; PG19-only вью роняет make test
        ошибкой, не называющей вью. В чеклисте patterns.md её нет.
      - Техдолг [035] применим к новым stats_age (замораживание ширины на 9 символов
        при входе в экран с пустой колонкой; после суток значения обрезаются).
        РЕШЕНО не чинить в этой фиче; расширить область действия записи техдолга.
      - Version-aware цикл и меню — новый паттерн (ни один цикл/меню сегодня версии
        не знает), сдвигает запиненный маппинг cy в menuSelect. Цена по диффу 017:
        ~65 строк продакшена в 5 файлах и вчетверо больше в тестах.
      - Класс "тест, который не может упасть": флагованное отношение обязано лежать
        в системной схеме, иначе тест escape-hatch проходит и без клаузы (см. notes 30).
    gaps: ""
    required: true

  technical_decisions:
    score: 60
    status: "partial"
    value: |
      Принято:
      - Фильтрация каталожных схем — через ViewType-тумблер (альтернативы: жёсткий фильтр
        в запросе; полагаться на `/`-фильтр — отвергнуты: ломают мышечную память с экрана
        tables и делают вопрос "доходит ли автовакуум до pg_toast" неотвечаемым).
      - relid не показываем.
      - Округление score до 2 знаков.
      - OrderKey = score DESC (отступление от OrderKey 0, прецедент replslots).
      - stats_age делаем на всех трёх экранах (альтернативы: только tables; отложить
        в 0.13 — отвергнуты по принципу "входим в область один раз").
      - Пункт меню на PG < 19 присутствует с пометкой недоступности; скрывать — отвергнуто
        ("явное лучше неявного").
      - Замер цены запроса не выносится в критерии приёмки.
      - DiffIntvl нового экрана = {0,0} — ЯВНОЕ решение, не умолчание. Все 11 колонок —
        мгновенные величины (скоры, булевы, накопленный объём мёртвых строк), диффовать
        нечего. Именно это делает LEFT JOIN и возможный NULL в dead_total безопасными
        без coalesce: calculateDelta коротко замыкается до diff(), ничего не парсится
        через ParseInt. Та же логика, что у archiver и activity.
      - Колонка названа dead_total, НЕ dead. Причина: на экране tables уже есть dead,
        и она внутри DiffIntvl {1,18}, то есть показывает прирост за интервал, а новая —
        абсолют. Одно имя для двух величин на соседних экранах одной хоткей-группы — это
        ровно зарегистрированный техдолг [023] (horizon_xacts на activity vs replication).
        Суффикс _total в проекте уже означает "абсолютное, не диффуемое": экран sizes
        (DiffIntvl {7,11}) держит size_total,KiB / table_total,KiB / toast_total,KiB вне
        диапазона и size,KiB / table,KiB / toast,KiB внутри; та же пара в procpidstat
        (read_total,KiB против read,KiB/s). Конвенция действующая, не изобретённая.
      - Экран sizes stats_age НЕ получает — явная граница объёма, и она по существу:
        sizes берёт из pg_stat_{{.ViewType}}_tables только СПИСОК отношений, все значения
        приходят из pg_total_relation_size/pg_relation_size. Это факты файловой системы,
        а не счётчики статистики, и вопрос "с какого момента накоплено" к ним неприменим.
      - Экран functions stats_age НЕ получает (вопрос 22, вариант C).
    gaps: ""
    required: false

