# ============================================================================
# Notes
# ============================================================================
notes: |
  ЖИВЫЕ ИЗМЕРЕНИЯ на PG 19beta2 (docker lesovsky/pgcenter-testing:0.0.11, кластер 21919),
  выполненные до и во время интервью. Это факты, не предположения — не выводить заново.

  Каталог:
  1. pg_stat_autovacuum_scores, 12 колонок: relid(oid), schemaname(name), relname(name),
     score, xid_score, mxid_score, vacuum_score, vacuum_insert_score, analyze_score
     (все double precision), do_vacuum, do_analyze, for_wraparound (boolean).
  2. 114 строк на пустом кластере — ВСЕ отношения, включая pg_catalog и pg_toast.
     Вариантов pg_stat_{user,sys,all}_autovacuum_scores НЕТ.
  3. На PG 18 вью отсутствует (to_regclass -> NULL).
  4. Привилегий не требуется: роль NOLOGIN без pg_monitor читает все 114 строк.

  Семантика score:
  5. score = greatest(xid_score, mxid_score, vacuum_score, vacuum_insert_score,
     analyze_score) — проверено на 116/116 строках.
  6. vacuum_score = n_dead_tup / (autovacuum_vacuum_threshold
                                  + autovacuum_vacuum_scale_factor * reltuples).
     Совпало до 4 знаков на трёх таблицах:
       big1  dead=50000 reltuples=200000 -> 50000/(50+40000)=1.2484 (наблюдалось 1.2484394)
       big2  dead=2000  reltuples=20000  -> 2000/(50+4000)=0.4938  (наблюдалось 0.4938271)
       small1 dead=60   reltuples=100    -> 60/(50+20)=0.8571      (наблюдалось 0.8571428)
     Аналогично vacuum_insert_score для big1: 200000/(1000+40000)=4.878 (наблюдалось 4.8780).
     Следствие: score >= 1 означает "порог перейдён".
  7. do_vacuum/do_analyze — фактический вердикт и он РАСХОДИТСЯ со score:
     ALTER TABLE big1 SET (autovacuum_enabled=false) оставил score 12.469 и
     vacuum_score 1.248, но переключил do_vacuum t -> f. Это и есть ответ на
     "почему не вакуумится"; по отдельности ни одна колонка его не даёт.
  8. Округление до 2 знаков достаточно: на реальных данных верх экрана 12.47 / 10.73 / 2.67,
     каталожный шум 0.00-0.16.

  Цена:
  9. SELECT count(*) FROM pg_stat_autovacuum_scores: 1.6 мс на 116 отношений,
     5.2-5.6 мс на 5116. Для сравнения pg_stat_all_tables на тех же 5116: 6.0-6.2 мс.
     Новый экран ДЕШЕВЛЕ экрана, который pgcenter и так обновляет раз в секунду.
     Тротлинг не нужен, вопрос закрыт измерением, а не рассуждением (прецедент 017).

  stats_reset (вторая половина фичи):
  10. PG 19 добавил stats_reset в ЧЕТЫРЕ вью: pg_stat_all_tables, pg_stat_all_indexes,
      pg_stat_user_functions И pg_statio_all_tables. Роадмап упоминает три; экраны
      tables/indexes в pgcenter — джойн stat+statio, поэтому источник надо выбрать.
      Расхождения между stat и statio не наблюдалось: pg_stat_reset_single_table_counters()
      выставляет одинаковый timestamp в оба.
  11. Значение NULL, пока статистику этого отношения не сбросили: 0 из 116 на свежем
      кластере. После pg_stat_reset() значение получают только отношения, у которых есть
      запись в pgstat (21 из 116), и оно равно pg_stat_database.stats_reset — то есть
      одинаково во всех строках экрана.
      Это НЕ то же, что stats_age на wal/archiver/bgwriter (кластерный счётчик, никогда
      не NULL — см. комментарий internal/query/archiver.go:14).
  12. pg_stat_user_functions пуст без track_functions (0 строк в фикстуре).

  Join для колонки dead (измерено):
  13. Наборы строк pg_stat_autovacuum_scores и pg_stat_all_tables СОВПАДАЮТ: 119 vs 119,
      ноль строк в любую сторону через NOT EXISTS. Одинаковые relkind: m (matview),
      r (table), t (toast). Временные таблицы отсутствуют в обоих. NULL n_dead_tup
      в LEFT JOIN не встречается.
      Тем не менее LEFT JOIN предпочтительнее INNER: совпадение не контрактное, а INNER
      тихо выкинул бы строку из очереди — ровно тот класс ошибки, который экран должен
      исключать. Coalesce не нужен: DiffIntvl {0,0} означает, что ничего не парсится,
      и пустая ячейка — честный рендер (та же логика, что у четырёх nullable-колонок
      archiver).
  14. Схемы в каталоге ровно три системные: information_schema, pg_catalog, pg_toast
      (+ public). Это и есть список для фильтра ViewType=user.

  Готовые идиомы, которые надо переиспользовать, а не изобретать:
  15. Булевы: `s.active::text AS active` (internal/query/replication_slots.go:16) —
      "true"/"false", не "t"/"f".
  16. Округление: `round(x, 2)` и `round(...)::text` (wal.go:7, functions.go:9-10,
      progress_vacuum.go:8-9, progress_cluster.go:9) — в SQL, не в Go.

  Из code-research (018-...-code-research.md), проверено мной поверх:
  17. ОШИБКА в исследовании: там сказано, что pg_statio_all_indexes НЕ получил stats_reset,
      и потому у экрана indexes выбора источника нет. Проверено на живом PG 19beta2 —
      stats_reset есть во ВСЕХ пяти: pg_stat_all_tables, pg_statio_all_tables,
      pg_stat_all_indexes, pg_statio_all_indexes, pg_stat_user_functions.
      Следовательно решение "берём из pg_stat_*" распространяется и на indexes.
  18. Цена нового цикла измерена по фактическому диффу 017 (git show 49f9f90):
      ~65 строк продакшена в 5 файлах и вчетверо больше в тестах.
      У "tables" та же коллизия имени группы и имени вью, что была у "wal": это
      report -T, префикс tar-записи и ключ describeReport — комментарий
      top/config_view.go:250-255 переносится дословно.
  19. toggleSysTables держит ТРИ отдельных литеральных списка имён вью
      (top/config_view.go:453, :466, :475) — новое имя нужно во всех трёх.
      query.Format — обычный text/template, поэтому
      {{if ne .ViewType "all"}}WHERE ...{{end}} работает без новой обвязки.
  20. Version guard рисует ERROR на месте всей таблицы (top/stat.go:793-802) каждый тик.
      Ни одно меню и ни один цикл в кодовой базе сегодня версию не знают
      (`J` предлагает PG16+ вью на PG14) — version-aware меню будет новым паттерном
      и сдвинет запиненный маппинг cy в menuSelect.
  21. Текущие layout-ы: tables 19/{1,18}, indexes 6/{1,5}, functions 8/{3,3};
      ни у одного нет селектора и case в Configure(). Все семь существующих stats_age —
      последняя колонка вне DiffIntvl, поэтому дописывание в хвост не трогает
      DiffIntvl и UniqueKey.
  22. view.Ncols в пакете report не читается вообще — рендер идёт от результата.
      Ripple по отчётам меньше, чем ожидалось.
  23. Точные новые литералы count-тестов: TestNew 28 -> 29; TestView_VersionOK меняется
      ТОЛЬКО в строке 190000; Test_filterViews wantN +1 во всех семи строках, wantV
      без изменений.
  24. ЛОВУШКА, которой нет в чеклисте patterns.md: record/recorder_test.go:30 передаёт
      НЕотфильтрованную карту вью в tarRecorder.collect, а фикстура по умолчанию — PG 17.
      PG19-only вью роняет make test с ошибкой, не называющей вью.
  25. Техдолг [035] применим к новым stats_age: ширины считаются по первому батчу и
      view.Aligned не сбрасывается, пока экран открыт. Войдя в tables на кластере, где
      stats_reset везде NULL, колонка замерзает на ширине заголовка (9). Значения до
      суток укладываются (00:00:03), а с "1 day 00:00:03" начинают обрезаться -> "1 day 0~".
      Severity Low: нужен вход в экран при пустой колонке И >24 ч на нём.
      Но это ровно история S3.

  ПОПРАВКА к пункту 13 (мой собственный факт, оказавшийся неполным):
  26. "Наборы строк совпадают точно" измерялось на кластере БЕЗ партиционированных таблиц.
      Как только появляется партиционированный родитель (relkind 'p'), наборы расходятся:
      114 (scores) / 115 (pg_stat_all_tables); родитель ЕСТЬ в pg_stat_all_tables и
      ОТСУТСТВУЕТ в pg_stat_autovacuum_scores (проверено напрямую по relid).
      Асимметрия односторонняя: строк, которые есть в scores и отсутствуют в
      pg_stat_all_tables, — НОЛЬ. Значит LEFT JOIN из scores в pg_stat_all_tables
      никогда не даёт пустую ячейку dead, а лишняя строка родителя просто не выбирается —
      что и правильно: у партиционированного родителя нет хранилища и вакуумить нечего.
      Направление джойна выбрано верно; поправка касается формулировки, не дизайна.
      Партиции-дети — обычные relkind 'r' и попадают в покрытый набор (вывод, не замер).
  27. for_wraparound = 0 строк на свежем кластере (ожидаемо). Минимально допустимый
      autovacuum_freeze_max_age = 100000 (проверено по pg_settings.min_val) — то есть
      воспроизвести S4 в фикстуре можно только сжиганием ~100k транзакций.

  Фикстура для S4 (for_wraparound) — доказана целиком, ЗАМЕРЕНО:
  28. ПОДВОХ 1: наивный цикл сжигает ОДИН xid, а не 100k. FOR i IN 1..100000 LOOP
      pg_current_xact_id() END LOOP внутри одного DO-блока сдвинул age(datfrozenxid)
      с 26 до 27. Нужны 100k ОТДЕЛЬНЫХ транзакций — процедура с COMMIT внутри цикла.
      Правильная форма: CALL burn(120000) на процедуре с COMMIT — 224-291 мс. Быстро.
  29. ПОДВОХ 2: autovacuum_freeze_max_age — GUC уровня postmaster. ALTER SYSTEM +
      pg_reload_conf() НЕ применяет его (SHOW продолжает отдавать 200000000), нужен
      рестарт кластера. Обход найден и проверен: per-table reloption применяется без
      рестарта — ALTER TABLE x SET (autovacuum_freeze_max_age = 100000) даёт
      for_wraparound = t, xid_score = 1.20, do_vacuum = t.
  30. ПОДВОХ 3 (класс "тест, который не может упасть", ровно тот, что 017 ловил мутациями):
      таблица в public видна в режиме user И БЕЗ escape-hatch, поэтому тест на ней прошёл бы
      с клаузой и без неё. Флагованное отношение должно лежать в СИСТЕМНОЙ схеме.
      Проверенная форма: ALTER TABLE toast_probe SET (toast.autovacuum_freeze_max_age
      = 100000) + burn(120000), 262 мс -> ровно одна строка с for_wraparound, и она
      в pg_toast (pg_toast_16532) — то есть буквально сценарий S4.
      Различающая проверка: режим user БЕЗ escape-hatch = 1 строка, С ним = 2.
      Удаление "OR for_wraparound" из WHERE роняет тест. Это тест, который МОЖЕТ упасть.

  Свободные хоткеи на момент интервью: T, e, g, u, y, c (проверено по top/keybindings.go).

  Размер пересмотрен M -> L владельцем проекта; основной вклад в L даёт вторая половина
  (три существующих экрана), а не новый экран.
