notes: |
  Pre-seeded from docs/roadmap-0.12.0.md section [016] and the [015] archive. The roadmap carries
  an unusual amount of already-settled design detail because this feature was split out of [015]
  mid-spec; the interview confirms rather than re-derives those, and focuses on what is genuinely
  open: the pager/editor return (settled in batch 1 — pause survives), the value argument (settled),
  and the acceptance surface.

  Stand for manual verification is available for this feature. Its address is NOT recorded here by
  deliberate policy (patterns.md: stands are ephemeral, a saved address is stale by the next
  session) — ask the author at the start of every run.

  SCOPE CHANGE after code research (2026-08-03): size raised S → M. The roadmap named the gate, the
  flag and the token; code research surfaced three unnamed work items that the author accepted —
  the repaint-from-store path for the five render-only keys (their viewCh-forced redraw is
  swallowed by the gate), the stored timestamp for the frozen clock, and making printDataCell
  non-mutating. It also corrected two roadmap claims: statCh is declared at ui.go:108 (not :73),
  and a non-receiving pause deadlocks the whole UI rather than showing a stale frame.

  Left to the tech-spec: the frame-store discipline (mutex on config vs publishing through
  g.Update). Both are workable; the choice is an implementation decision, not a product one.
