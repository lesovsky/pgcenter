# Interview Plan for Feature Planning — 016-feat-pause-display
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete

interview_metadata:
  feature_name: "016-feat-pause-display"
  feature_base: "docs/features/016-feat-pause-display/016-feat-pause-display"
  work_type: "feature"
  started: "2026-08-03 12:26:38"
  last_updated: "2026-08-03 12:35:00"
  status: "in_progress"
  can_resume: true
  current_question_num: 24
  feature_size: "M"

conversation_history:
  - question_num: 1
    timestamp: "2026-08-03 12:35:00"
    topic: "user_problem / value"
    agent_question: |
      Is there a personal use case, or is this pure analogy? The roadmap's own counterarguments:
      `z` allows a refresh interval up to 300s, and pgcenter usually runs inside tmux with
      copy-mode. My counter-counterargument, proposed as the real justification: copy-mode freezes
      the screen at the cost of losing control — you cannot column-scroll ([009] `[`/`]`), set a
      filter or toggle verbose inside it; and `z 300` is not a pause but "rare refresh" — the frame
      still changes at an unpredictable moment, exactly while you are reading a row. Pause gives
      what neither workaround gives: frozen data plus live interaction with it.
    user_answer: |
      Yes, agreed — and the most valuable part is the guarantee against a sudden screen change and
      losing the data you were reading.
    summary: "Value confirmed: guarantee against sudden frame change / data loss while reading. Frozen data + live interaction is the framing."

  - question_num: 2
    timestamp: "2026-08-03 12:35:00"
    topic: "edge_cases / pager-editor return"
    agent_question: |
      Returning from pager/editor while paused — the roadmap's only genuinely open question.
      mainLoop rebuilds the Gui, old buffers destroyed. (a) pause survives the return: repaint the
      stored frame — the flag lives on `config` which survives the rebuild, and the frame must be
      stored anyway for resize and `v`, so the cost is one explicit repaint after rebuild.
      (b) the return lifts the pause: simpler, but the mode silently drops — the exact defect class
      [015] fixed with the filter indicator. I recommend (a).
    user_answer: |
      Yes, option A — especially since the infrastructure for it is already there.
    summary: "DECIDED: pause survives pager/editor return; repaint from the stored frame after UI rebuild."

  - question_num: 3
    timestamp: "2026-08-03 12:35:00"
    topic: "ui_ux_requirements / freeze scope"
    agent_question: |
      Does the freeze cover the whole screen or only the stats table? Roadmap says "gates the
      render", i.e. the whole frame — the sysstat/pgstat top panels freeze too, and the header
      clock (top/stat.go:272) then shows the freeze time rather than the current time. I read that
      as correct (a coherent snapshot including when it was taken), but it must be named
      explicitly or it reads as a bug. Gating only `dbstat` would let the header numbers drift
      apart from the table. Freeze everything, and is `[PAUSED]` in the cmdline enough of a marker?
    user_answer: |
      Freeze everything, and the PAUSED marker is enough.
    summary: "DECIDED: whole-frame freeze including the top panels and the header clock; [PAUSED] in cmdline is the sole marker."

  - question_num: 4
    timestamp: "2026-08-03 12:35:00"
    topic: "testing_strategy / feature_size"
    agent_question: |
      Size S (4-5 files, little new logic but all of it in dangerous places: the race, draining an
      unbuffered channel, repaint after rebuild). Tests: unit for the doWork gate on fake channels
      (drain-and-discard proven by the collector not blocking), the [PAUSED] token through a
      bytes.Buffer ([015] precedent), plus a tmux stand run per patterns.md. No integration/E2E —
      the feature touches no database surface. Agreed? Is a stand available for this feature?
    user_answer: |
      Agreed on tests. Stand is available (address given in session; deliberately not recorded here
      per patterns.md — stands are ephemeral, ask the author at the start of each run).
    summary: "Size S. Unit tests + tmux stand run; no integration/E2E. Stand available for this feature."

  - question_num: 5
    timestamp: "2026-08-03 12:45:00"
    topic: "constraints / what lifts the pause"
    agent_question: |
      Full classification of the hotkey table (top/keybindings.go:19-83) by the criterion "does
      this action need fresh data from the collector?". LIFTS the pause: sort (arrows, `<`) because
      row order is produced in the collector; `,` sys tables, `I` idle conns, `A` age because they
      change the SQL; every screen switch (letters, menus, `S`) because the frame belongs to
      another screen. KEEPS the pause: `/` filter and `\` clear-filters — filtering happens at
      render time (top/stat.go:743 printStatData with isFilterRequired), so it applies to the
      stored frame; `[`/`]` scroll and up/down width ([009], pure render); terminal resize;
      pager/editor return; DB actions (`-`, `_`, `k`, `K`, `R`, `G`, `n`); `z` refresh interval and
      `Q` reset stats (effect visible after resume); `h` help and `m` mask (overlays).
    user_answer: |
      The list is fine, but the documentation must state explicitly what lifts the pause, so it is
      not a surprise and a reason to file a bug report.
    summary: |
      DECIDED: classification accepted as proposed. NEW REQUIREMENT: the set of pause-lifting
      actions must be documented user-visibly (help screen), not only in the spec — an
      unexplained lift reads as a defect.

  - question_num: 6
    timestamp: "2026-08-03 12:45:00"
    topic: "edge_cases / data-dependent toggles while paused"
    agent_question: |
      A class the roadmap misses: `v` (verbose) and `B`/`N`/`F`/`L` (side panels) are toggles that
      REQUIRE fresh collector data — verbose aggregates are only collected once view.Verbose has
      ridden viewCh ([010]). Pressing `v` while paused would expand the panels filled with `n/a`,
      because the stored frame has no such fields. Options: (a) these toggles lift the pause;
      (b) keep the pause and show n/a until resume — looks broken; (c) keep the pause and defer the
      toggle until resume — "pressed it, nothing happened", the worst. Recommended (a).
    user_answer: |
      Option A is fine.
    summary: "DECIDED: `v` and the `B`/`N`/`F`/`L` side-panel toggles lift the pause, like the other data-dependent actions."

  - question_num: 7
    timestamp: "2026-08-03 12:45:00"
    topic: "error_scenarios"
    agent_question: |
      The roadmap floated "frames carrying an error bypass the pause gate" but admits tech debt
      [016] makes it weaker than it sounds — some collector errors are swallowed and arrive as an
      empty frame rather than one with Error set. Proposal: no exception at all — the pause gates
      everything, errors included. A bypass gives a false guarantee (half the errors are invisible
      anyway), the pause is a deliberate operator action, and it is one special case fewer in the
      gate. The alternative (bypass + auto-lift) means the pause drops by itself with no
      explanation.
    user_answer: |
      Do not bypass errors — the user is examining a frozen screen and will see the error
      immediately after unpausing. That is enough.
    summary: "DECIDED: no error bypass. The gate is unconditional; errors surface on resume."

  - question_num: 8
    timestamp: "2026-08-03 12:45:00"
    topic: "success_criteria"
    agent_question: |
      Proposed success statement: operator presses Space on a fast-refreshing screen (activity
      under load, refresh 1s); data stops changing immediately and stays unchanged indefinitely;
      [PAUSED] is visible in the cmdline throughout; filter, column scroll and width change work on
      the frozen frame; a second Space restores live updates and the first post-resume frame is a
      normal fresh frame with no delta spike; the collector is never blocked (unit-tested against
      the unbuffered statCh).
    user_answer: |
      All fine.
    summary: "Success criteria accepted as proposed."

  - question_num: 9
    timestamp: "2026-08-03 13:05:00"
    topic: "user_stories"
    agent_question: |
      Three proposed stories: (1) freeze the activity screen under load to read/copy the row of a
      long transaction that would otherwise scroll away on the next refresh; (2) apply a filter and
      column-scroll on the frozen frame to inspect a suspicious set of rows without losing that
      moment; (3) returning from the pager (`l`, log view) does not drop the pause, so you come
      back to exactly the frame you went to the log for.
    user_answer: "Accepted."
    summary: "Three user stories accepted as proposed; no fourth scenario added."

  - question_num: 10
    timestamp: "2026-08-03 13:05:00"
    topic: "ui_ux_requirements / token priority"
    agent_question: |
      The [015] composer degrades tokens right-to-left; `[PAUSED]` sits left of `[F:col]`, so on a
      narrow terminal the FILTER indicator shrinks and drops first while `[PAUSED]` survives.
      Option A: give `[PAUSED]` a single rendering variant — it never shrinks, expressing "must
      always be visible" in data rather than as a special case. Cost: on a very narrow screen the
      operator loses the filter cue (the footgun [015] was built for), leaving only the `*` on the
      column header. Option B: give it a short `[P]` variant so both fit.
    user_answer: "Never shrinks."
    summary: "DECIDED: `[PAUSED]` has exactly one rendering variant and never degrades; the filter token yields first on a narrow terminal."

  - question_num: 11
    timestamp: "2026-08-03 13:05:00"
    topic: "documentation / help screen"
    agent_question: |
      Proposed help.go insertion in the general-actions block, after the `[`/`]` line:
        Space             'Space' pause/resume display; actions that need fresh data
                          (sort, screen switch, ',', I, A, v, B, N, F, L) resume it.
      Two lines, in the style of the existing entries. Note doc/pgcenter-top-readme.md carries no
      hotkey list, so the built-in help is the only user-facing place to document this.
    user_answer: "The wording is fine."
    summary: "DECIDED: help.go gains a two-line Space entry naming the pause-lifting set. Built-in help is the only doc surface (no hotkey list in doc/)."

  - question_num: 12
    timestamp: "2026-08-03 13:05:00"
    topic: "edge_cases / Space before the first frame"
    agent_question: |
      At startup the screen shows `collecting...` and no frame exists yet. (a) the pause engages,
      `[PAUSED]` is visible, the screen keeps showing `collecting...` until resume; (b) Space is
      ignored until the first frame arrives. Recommended (a): pause is a state, not an operation on
      data; a "no frame yet" special case is an extra branch in the gate, and the operator sees
      `[PAUSED]` immediately and understands why nothing appears.
    user_answer: "Option A."
    summary: "DECIDED: Space engages the pause even before the first frame; no special case in the gate."

  - question_num: 13
    timestamp: "2026-08-03 13:20:00"
    topic: "ui_ux / frozen clock — after code research"
    agent_question: |
      Code research finding: renderSysstat prints time.Now() inline (top/stat.go:277), so a
      repainted stored frame shows the LIVE clock over frozen stats — the incoherence Q3 rejected.
      Price of freezing it: thread a stored timestamp into renderSysstat — one new signature plus
      4 existing test call sites (stat_test.go:44, 85, 199, 431). Recommendation: pay it.
    user_answer: "Confirmed."
    summary: "DECIDED: the clock freezes with the frame; a stored timestamp is threaded into renderSysstat (4 test signatures churn)."

  - question_num: 14
    timestamp: "2026-08-03 13:20:00"
    topic: "scope / repaint for render-only keys — after code research"
    agent_question: |
      Largest unnamed work item: `[`, `]`, `↑`, `↓`, `\` force their redraw today by pushing on
      viewCh (config_view.go:57-58, "solely to trigger an immediate redraw"). The gate swallows
      that frame, so while paused these keys would silently do nothing unless an explicit
      repaint-from-store is wired. (i) implement the repaint — "freeze, filter, scroll" works and
      the value from Q1 survives; (ii) declare these keys pause-lifting too — less work, but the
      feature degenerates into a still frame you cannot interact with, at which point tmux
      copy-mode is nearly equivalent. Recommended (i). Also: with the repaint paths, the stored
      timestamp and the frame protection, this is no longer size S — propose M.
    user_answer: "Implement the repaint from the store. M — agreed."
    summary: |
      DECIDED: explicit repaint-from-stored-frame for the render-only keys and for the post-pager
      UI rebuild. Feature size raised S → M.

  - question_num: 15
    timestamp: "2026-08-03 13:20:00"
    topic: "technical_decisions / protecting the stored frame"
    agent_question: |
      printDataCell truncates in place (top/stat.go:1113), so a stored frame is destroyed by its
      own rendering — widen a column while paused and the original value is gone; and for
      DiffIntvl=[0,0] views (including `activity`, the default screen) that write lands in the
      collector's own snapshot. Options: deep-copy Values at store time, or make printDataCell
      non-mutating (truncate into a local). The second is one line and fixes the cause — the latent
      aliasing write disappears too — at the price of touching a hot path pinned by 4 tests.
    user_answer: "Non-mutating printDataCell — yes."
    summary: |
      DECIDED: make printDataCell non-mutating rather than deep-copying the frame. Fixes the cause
      (the aliasing write into the collector's snapshot for [0,0] views) instead of working around it.

  - question_num: 16
    timestamp: "2026-08-03 13:20:00"
    topic: "ui_ux / making the token appear immediately"
    agent_question: |
      The `[PAUSED]` token only reaches the screen when something writes the cmdline, so the Space
      handler must perform exactly ONE cmdline write (the "one call per path" rule from
      patterns.md; two writes is defect class [027]). Should that write carry a text message
      ("Display paused"), or silently re-render the line with the token?
    user_answer: "Silent re-render is fine."
    summary: |
      DECIDED: the Space handler performs exactly one silent cmdline re-render — no text message.
      The token is self-sufficient and a message would vanish after the 2s timer, causing flicker.

  - question_num: 17
    timestamp: "2026-08-03 13:40:00"
    topic: "risks"
    agent_question: |
      Proposed risk table: (1) UI deadlock if the gate ever stops receiving — mitigated by
      drain-and-discard plus a test asserting the collector completes N sends while paused, which
      requires extracting the doWork select loop; (2) a render-only key silently doing nothing
      because its viewCh-forced redraw is swallowed — mitigated by explicit repaint-from-store,
      each of the five exercised on the stand; (3) infinite UI rebuild loop if a repaint errors out
      of a g.Update closure — mitigated by repainting at the top of the new doWork, after gocui's
      first flush, with the ordering guarantee stated in the tech-spec; (4) render regression from
      the non-mutating printDataCell (hot path, 4 tests) — mitigated by unit tests plus a stand run
      against a master-built binary; (5) stuck pause, the operator reading dead numbers as reality
      — mitigated by [PAUSED] never degrading.
    user_answer: "ok"
    summary: "Risk list accepted as proposed, five entries with mitigations."

  - question_num: 18
    timestamp: "2026-08-03 13:40:00"
    topic: "verification_strategy"
    agent_question: |
      Proposed stand scenario, 8 steps: (1) activity under load, refresh 1s — frozen >=60s,
      [PAUSED] visible, clock frozen; (2) while paused `/`, `\`, `[`, `]`, `↑`, `↓` each produce a
      visible effect; (3) pager round-trip while paused — same frame, not blank; (4) tmux resize
      190 → 60 → 190 while paused; (5) narrow terminal (-x 60) with an active filter — [PAUSED]
      stays, [F:...] drops; (6) every lifting key — pause lifts, first frame normal; (7) Space
      before the first frame; (8) widening a column while paused does not leave `...~`.
    user_answer: "ok"
    summary: "Stand verification scenario accepted as proposed, 8 steps."

  - question_num: 19
    timestamp: "2026-08-03 14:00:00"
    topic: "scope / release ordering — devil's advocate challenge"
    agent_question: |
      The dev-customer agent argued [016] should be deferred or moved last: it shares no code area
      with [017]-[020], so deferring it costs zero extra passes (unlike [014], whose deferral the
      roadmap calls a paid cost), while [020] is described as pgcenter's biggest functional gap for
      incident work. Options: (a) keep it next; (b) keep it but last, after [017]-[020];
      (c) defer out of the release like [014].
    user_answer: |
      [016] stays in 0.12.0, next after [015]; [017]-[020] follow it. Roadmap order unchanged.
    summary: "DECIDED: roadmap order stands — [016] is next, then [017]-[020]. Challenge considered and rejected by the roadmap owner."

  - question_num: 20
    timestamp: "2026-08-03 14:00:00"
    topic: "scope / cheaper variants — devil's advocate challenge"
    agent_question: |
      The agent showed all three unplanned work items exist only to keep the frozen frame
      interactive, and proposed cutting back to a non-interactive pause (size S). I added a middle
      option the agent did not name: interactive but NOT surviving the pager return, which removes
      the riskiest path (an error out of a g.Update closure tears down MainLoop → rebuild →
      repaint → fails again → infinite rebuild loop). Options: (i) as decided, interactive and
      pager-surviving (M); (ii) interactive without pager survival; (iii) non-interactive (S).
    user_answer: |
      Interactive pause surviving the pager — option (i), as decided (M).
    summary: "DECIDED: scope unchanged — interactive pause that survives the pager return, size M. Cheaper variants considered and rejected."

  - question_num: 21
    timestamp: "2026-08-03 14:00:00"
    topic: "ui_ux / token degradation — devil's advocate challenge"
    agent_question: |
      The agent argued (and I agreed) that "[PAUSED] never shrinks" trades away the [015] filter
      indicator — which closes a CONFIRMED misreading footgun — in favour of a marker for a feature
      with unproven demand; a short `[P]` variant would let both fit on a narrow terminal.
    user_answer: |
      Never shrinks. Running pgcenter on a terminal so narrow that even the token does not fit is
      madness.
    summary: |
      DECIDED, re-confirmed after challenge: `[PAUSED]` keeps exactly one variant. Rationale from
      the owner: both tokens together are ~18 columns, so the conflict only arises on an
      unreasonably narrow terminal that nobody runs pgcenter on.

  - question_num: 22
    timestamp: "2026-08-03 15:10:00"
    topic: "edge_cases / logtail side panel — found by the adequacy validator"
    agent_question: |
      The `L` side panel re-reads the log file at RENDER time (top/stat.go:226-245), mutates
      config.logtail.Size and can return an error out of the g.Update closure. A panel opened
      BEFORE the pause would therefore keep pulling fresh log lines over frozen statistics on every
      repaint, and would be a second, unnamed source of the infinite-rebuild risk. Options: (a)
      freeze the panel with the frame — the file is not re-read while paused; (b) let it stay live.
      Recommended (a).
    user_answer: "Option A."
    summary: |
      DECIDED: the logtail side panel freezes with the frame — no file reads while paused. Removes
      the second infinite-rebuild source entirely.

  - question_num: 23
    timestamp: "2026-08-03 15:10:00"
    topic: "constraints / resize repaint mechanism — found by the adequacy validator"
    agent_question: |
      gocui delivers no resize event to the application: the only place that sees the new size is
      the layout callback, invoked on every flush. Keeping the "resize repaints the frozen frame"
      requirement therefore means putting a size-change detector into code shared by every screen —
      the same re-entrant point where the infinite-rebuild risk lives. Options: (i) keep the
      requirement, with the mechanism and its safety argument settled in the tech-spec;
      (ii) lower it — the frame stays as it was and re-lays out only after the pause is lifted.
    user_answer: "Option (i)."
    summary: |
      DECIDED: resize repaints the frozen frame. Accepted consequence: this is the one requirement
      reaching outside the feature's own perimeter (the shared layout code); the mechanism is an
      explicit tech-spec decision, not something to improvise during implementation.

  - question_num: 24
    timestamp: "2026-08-03 16:20:00"
    topic: "edge_cases / logtail panel after a UI rebuild — introduced by the round-1 fix"
    agent_question: |
      Freezing the logtail panel (Q22) left it with no data source across a UI rebuild: on the
      pager path the `extra` view is recreated with an empty buffer, and the only code that fills
      it is the log-file read that the pause now skips. Log lines live nowhere else — `stat.Stat`
      does not carry them. So scenario 3 (pager round-trip) with `L` open would show an empty
      bottom third. Options: (a) store the shown log lines alongside the frame, so the repaint
      restores the panel; (b) accept an empty panel until the pause is lifted and reword the spec.
      Recommended (a) — under (b) the operator goes to read the log and comes back to an empty log
      panel.
    user_answer: "Option A."
    summary: |
      DECIDED: the displayed log lines are stored together with the frame and restored on repaint,
      including after a UI rebuild. Closes the defect the Q22 fix introduced.

phase1_feature_overview:

  feature_description:
    score: 90
    status: "complete"
    value: |
      Pause the TUI display on `Space` (roadmap 0.12.0, section [016], split off from [015] on
      2026-08-02). The collector keeps running; only rendering is gated, and the gate covers the
      WHOLE frame — stats table, sysstat/pgstat top panels and the header clock alike, so a paused
      screen is a coherent snapshot of one moment including when that moment was. `[PAUSED]` shows
      in the cmdline as a second token next to the [015] filter indicator and is the sole marker.
      Plumbing: top/ui.go (statCh branch in doWork), top/config.go, top/keybindings.go, top/help.go.
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: |
      The guarantee against a sudden frame change losing the data you are reading. Confirmed by the
      author as the core value. The two workarounds each fail differently: tmux copy-mode freezes
      the screen but takes away interaction (no [009] column scroll, no filter, no verbose toggle
      inside it), and `z 300` is not a pause but a rare refresh — the frame still changes at an
      unpredictable moment, typically while a row is being read. Pause is the only way to get
      frozen data AND live interaction with it.
      Honest framing kept from the roadmap: no reported incident behind this; argued by analogy
      plus the interaction gap above.
    gaps: ""
    required: true

  target_users:
    score: 70
    status: "complete"
    value: |
      Practicing PostgreSQL DBA driving the TUI during an incident (release audience lens): reading
      a row on a busy screen (activity / statements) where the refresh keeps reshuffling it.
    gaps: ""
    required: false

  success_criteria:
    score: 90
    status: "complete"
    value: |
      The operator presses `Space` on a fast-refreshing screen (activity under load, refresh 1s);
      data stops changing immediately and stays unchanged indefinitely; `[PAUSED]` is visible in
      the cmdline throughout; filter, column scroll and width change still work on the frozen
      frame; a second `Space` restores live updates and the first post-resume frame is a normal
      fresh frame with no delta spike; the collector is never blocked (unit-tested against the
      unbuffered statCh).
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: |
      Settled during the [015] interview, not to be re-opened:
      - pause gates the RENDER only, collector keeps running (otherwise prev freezes and the first
        post-resume frame shows a whole-pause-window delta in per-interval columns);
      - statCh is unbuffered (top/ui.go:73) → pause must DRAIN AND DISCARD frames, not just skip;
      - the last frame must be STORED so a resize / verbose toggle while paused repaints it, and
        (decided here) so the pause survives a pager/editor return;
      - changing the sort column LIFTS the pause (sorting runs in the collector goroutine);
        switching screens lifts it too;
      - the flag is the only cross-goroutine race: atomic.Bool on `config`, not a doWork local;
      - bind gocui.KeySpace scoped to "sysstat", never globally (a global binding breaks typing a
        space into dialogs).

      Settled here (batch 2) — the full pause-lifting set, by the criterion "does the action need
      fresh collector data?":
      LIFTS: sort (arrows ←→, `<`); `,` sys tables; `I` idle conns; `A` age; every screen switch
      (letter keys, menus, `S` procpidstat); `v` verbose; `B`/`N`/`F`/`L` side panels.
      KEEPS: `/` filter and `\` clear filters (render-time — top/stat.go:743); `[`/`]` scroll and
      ↑↓ width; terminal resize; pager/editor return (`l`, `C`, `~`); DB actions (`-`, `_`, `k`,
      `K`, `R`, `G`, `n`); `z` refresh interval; `Q` reset stats; `h` help; `m` mask.
      REQUIREMENT that follows: the lifting set must be documented on the help screen, not only in
      the spec — an unexplained lift reads as a defect and invites a bug report.
      Error frames are NOT exempt: the gate is unconditional.
    gaps: ""
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      Unit tests: the doWork pause gate driven on fake channels (drain-and-discard proven by the
      collector not blocking on an unbuffered send), and the `[PAUSED]` cmdline token rendered
      against a bytes.Buffer ([015] precedent, printers take io.Writer).
      No integration tests and no E2E: the feature touches no database surface and adds no query.
      Manual: a tmux stand run per the patterns.md regimen (fresh `make build`, explicit binary
      path, deterministic geometry, `capture-pane -e` where attributes matter, second binary from
      master to separate regressions from pre-existing behaviour). Stand is available for this
      feature; its address is deliberately not recorded in the repository.
    gaps: ""
    required: true

