      - `Space` on a live screen freezes the whole frame — table, top panels and the header clock —
        and `[PAUSED]` appears in the cmdline immediately (one silent cmdline re-render).
      - The freeze holds indefinitely; the collector is never blocked (proven by a test asserting N
        completed sends while paused).
      - On the frozen frame: filter (`/`), clear filters (`\`), column scroll (`[`/`]`) and column
        width (`↑`/`↓`) all take visible effect via repaint-from-store.
      - Pause-lifting actions (sort, `,`, `I`, `A`, screen switch, `v`, `B`/`N`/`F`/`L`) resume
        live updates, and the help screen names that set.
      - The pause survives a pager/editor/psql return: the stored frame is repainted after the UI
        rebuild instead of a blank screen.
      - Terminal resize while paused repaints the stored frame with a recomputed column window.
      - A second `Space` resumes; the first frame after resume is a normal fresh frame with no
        delta spike.
      - `Space` pressed before the first frame engages the pause with no special case.
      - Error frames are discarded like any other while paused and surface on resume.
      - Widening a column while paused does not show permanently truncated `~` text
        (non-mutating printDataCell).
    gaps: ""
    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      DECIDED — pager/editor return: the pause SURVIVES it; after the UI rebuild the stored frame
      is repainted explicitly. Rationale: the frame store is required anyway (resize, verbose), and
      a silently dropped mode is the defect class [015] closed with the filter indicator.
      DECIDED — resize and any render-only action repaint from the stored frame.
      DECIDED — `v` and `B`/`N`/`F`/`L` lift the pause rather than render `n/a` panels: they are
      toggles that require collector data the stored frame does not carry ([010] verbose
      aggregates ride viewCh), so keeping the pause would either look broken (n/a everywhere) or
      swallow the keypress until resume.
      DECIDED — filter (`/`, `\`) applies to the stored frame without lifting the pause, because
      filtering is a render-time operation (top/stat.go:743).
      DECIDED — `Space` before the first frame engages the pause; no "no frame yet" special case.
      FOUND BY CODE RESEARCH, decided: `[`, `]`, `↑`, `↓`, `\` force their redraw today by pushing
      on viewCh (config_view.go:57-58), a frame the gate swallows — so each needs an explicit
      repaint-from-store, otherwise the key silently does nothing while paused.
      FOUND BY CODE RESEARCH: overlays (help, menus, dialogs) need NO repaint — gocui redraws the
      underlying views from their line buffers (gui.go:422-470). Only two paths need an explicit
      repaint: the render-only keys and the post-pager UI rebuild.
      FOUND BY CODE RESEARCH, decided: the header clock is re-derived at render time
      (time.Now(), top/stat.go:277), so freezing it requires a stored timestamp threaded into
      renderSysstat.
      Space is scoped to "sysstat", so it cannot fire while a dialog is current
      (gocui keybinding.go:36-41) — typing a space into a regexp filter stays safe.
      FOUND BY THE COMPLETENESS CHECKER, verified in code: `setFilter`
      (top/config_view.go:124-145) never pushes on viewCh at all — it only edits view.Filters and
      returns a message. In live mode the filter becomes visible on the next collector tick; while
      paused that tick never renders, so applying a filter would appear to do nothing. The repaint
      list therefore includes the `dialogFilter` branch of `dialogFinish` (top/dialog.go:216), not
      just the five render-only keys. Its dialog neighbours (`changeQueryAge`, `changeRefresh`,
      `setProcMask`) do push viewCh, so the blind spot is the filter alone. Both the roadmap and
      the code research missed this.
    gaps: ""
    required: true

  error_scenarios:
    score: 85
    status: "complete"
    value: |
      DECIDED — no error bypass. The gate is unconditional: error frames and connection loss are
      discarded like any other frame while paused, and surface on the first frame after resume.
      Rationale: a bypass would be a false guarantee, since tech debt [016] means some collector
      errors are swallowed and arrive as an empty frame rather than one with `Error` set — so half
      the errors would not bypass anything. Auto-lifting on an error frame was rejected too: the
      pause would drop by itself with no explanation. The operator is deliberately examining a
      frozen screen and sees reality one keypress later.
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      Agent, via `make test`: the drain gate (collector completes N sends while paused), the
      `[PAUSED]` token in composeCmdline/cmdlineTokens against a bytes.Buffer, the non-mutating
      printDataCell, and the frozen-timestamp path through renderSysstat.
      Agent, on the tmux stand (patterns.md regimen — fresh `make build`, explicit binary path,
      deterministic geometry, second binary from master):
        1. activity under load, refresh 1s: Space → data frozen >=60s, [PAUSED] visible, header
           clock frozen too;
        2. while paused: `/`, `\`, `[`, `]`, `↑`, `↓` each produce a visible effect;
        3. while paused: `l` (log in pager) → return → same frame, not a blank screen, [PAUSED] intact;
        4. while paused: tmux resize 190 → 60 → 190; the frame repaints for the new width with
           correct edge markers;
        5. narrow terminal (-x 60) with an active filter: [PAUSED] stays, [F:...] drops;
        6. each lifting key (sort, `,`, `I`, `A`, screen switch, `v`, `B`): pause lifts, first frame
           is normal with no delta spike;
        7. Space immediately after start, before the first frame: [PAUSED] appears, `collecting...`
           stays;
        8. widening a column while paused: the value is not permanently truncated to `...~`.
      User: confirms on the stand that a paused screen holds under real load and that the marker is
      unmistakable.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 90
    status: "complete"
    value: |
      `[PAUSED]` token to the LEFT of the [015] filter token `[F:...]` in the cmdline, via the
      cmdlineToken composer (renderings longest-to-shortest; a single-variant token never shrinks).
      The whole frame freezes — top panels and the header clock included; `[PAUSED]` is the sole
      marker of that state, no additional visual treatment.
      DECIDED: `[PAUSED]` has exactly ONE rendering variant — it never degrades. On a narrow
      terminal the filter token yields first (accepted cost: the `*` on the column header remains
      the only filter cue there).
      DECIDED: the Space handler performs exactly one silent cmdline re-render, no text message —
      the token is self-sufficient, and a message would vanish with the 2s timer and flicker.
      DECIDED: help.go gains a two-line `Space` entry naming the pause-lifting set; the built-in
      help is the only user-facing hotkey documentation (doc/pgcenter-top-readme.md has no list).
      KNOWN CONSEQUENCE to record in the spec (found by the completeness checker, from code
      research §6.2): while paused the `[PAUSED]` token takes ~8 runes off the width available to
      dialog prompts, so on a narrow terminal a prompt such as "Set state mask" is clipped earlier
      than it is today. One acceptance line, not a design change — recorded so QA does not read it
      as a defect.
    gaps: ""
    required: true

  risks:
    score: 90
    status: "complete"
    value: |
      - UI DEADLOCK if the gate ever stops receiving from statCh: the collector parks on the send,
        and since ~17 handlers push on the unbuffered viewCh, the first keypress hangs MainLoop
        permanently — Space itself cannot recover it. Mitigation: drain-and-discard is the only
        shape; a test asserts the collector completes N sends while paused, which requires
        extracting the doWork select loop into a testable function.
      - A RENDER-ONLY KEY SILENTLY DOES NOTHING while paused, because its viewCh-forced redraw is
        swallowed by the gate. Mitigation: explicit repaint-from-store for `[`, `]`, `↑`, `↓`, `\`;
        all five exercised on the stand.
      - INFINITE UI REBUILD LOOP: an error returned from a g.Update closure (e.g. referencing a
        view that does not exist yet) tears down MainLoop, which rebuilds the UI, which repaints,
        which fails again. Mitigation: the repaint runs at the top of the new doWork, after gocui's
        first flush() — an ordering guarantee (gui.go:367/376) that the tech-spec must state as the
        reason it is safe, rather than relying on luck.
      - RENDER REGRESSION from making printDataCell non-mutating: a hot path pinned by 4 tests.
        Mitigation: unit tests plus a stand run with a second binary built from master, so a
        regression is separated from pre-existing behaviour.
      - STUCK PAUSE: the operator forgets the mode and reads dead numbers as the cluster's current
        state. Mitigation: `[PAUSED]` never degrades — it outranks every other cmdline token.
    gaps: ""
    required: true

  technical_decisions:
    score: 85
    status: "complete"
    value: |
      - Bind `gocui.KeySpace`, never the rune `' '`: termbox classifies bytes <= 0x20 as functional
        keys (Ch=0, Key=KeySpace), and gocui matches on key && ch && mod, so a rune binding would
        never fire (termbox.go:575-580, keybinding.go:31-33).
      - The pause flag is an `atomic.Bool` on `top.config` — the first field written on the gocui
        goroutine and read on the worker goroutine; `make test` runs with -race, so this is not
        optional. Do NOT add `view.View.Paused`: it would ride viewCh and disturb collectStat's
        load-bearing change-detection ladder (top/stat.go:86-122).
      - `printDataCell` becomes non-mutating (truncate into a local) instead of deep-copying the
        stored frame: it fixes the cause, including the latent aliasing write into the collector's
        snapshot for DiffIntvl=[0,0] views.
      - The frame store cannot be a `doWork` local (doWork returns on the pager path), so it is a
        SECOND cross-goroutine object beyond the flag. Its discipline — mutex on config vs
        publishing through g.Update — is left to the tech-spec.
      - Do not add a second cmdline write anywhere in the pause path (defect class [027]).
    gaps: ""
    required: false

phase3_integration:

  integration_points:
    score: 90
    status: "complete"
    value: |
      Verified by code research (file:line in the research doc):
      - top/ui.go — the doWork select and its statCh branch (ui.go:128) is where the gate goes;
        the post-rebuild repaint runs at the top of the new doWork (safe by gocui's flush-then-loop
        ordering, gui.go:367/376); cmdlineTokens (ui.go:406) is the single edit point for the token.
      - top/config.go — the atomic.Bool flag next to the other display-mode fields, and possibly
        the frame store.
      - top/keybindings.go — one row, scoped "sysstat".
      - top/pause.go (new) — handler + token helper, mirroring top/verbose.go in size and shape.
      - top/help.go — the Space entry (user-visible requirement from Q5).
      - top/stat.go — the timestamp parameter to renderSysstat (frozen clock) and the non-mutating
        printDataCell; printStat is reused verbatim as the repaint function.
      - top/config_view.go — the render-only key handlers gain a repaint path instead of relying on
        their viewCh push.
      record/report and internal/view are untouched: no view.View field, no query, no recorded
      format change.
    gaps: ""
    required: true

  dependencies:
    score: 80
    status: "complete"
    value: |
      [015] cmdline composer (token model, ambient cmdlineCfg, generation-gated clear timer) — the
      composer itself needs no change; the token is data. [009] horizontal scroll and the
      autoScrollToOrderKey one-shot are the precedent for render-only state on top.config.
      [010] verbose is an explicit counter-example: pause needs no collector home, so unlike
      verbose it stays single-homed.
    gaps: ""
    required: false

  data_requirements:
    score: 85
    status: "complete"
    value: |
      The stored frame is the whole `stat.Stat` (all panels need it — the freeze covers the whole
      screen) plus the frame timestamp for the frozen clock. `stat.Stat` travels by value and
      shares slice headers; with a non-mutating printDataCell the render path no longer writes into
      the frame, so a deep copy is not required. Diskstats/Netdevs/Fsstats are read-only on the
      render path and their toggles lift the pause anyway.
      Plus the log lines currently shown by the logtail side panel (Q24): they exist nowhere in
      `stat.Stat`, and the only code that fills that panel is the file read the pause disables, so
      without storing them a UI rebuild would leave the panel empty.
    gaps: ""
    required: false

  migration_needs:
    score: 60
    status: "complete"
    value: |
      None. TUI-only: no recorded format change, no new query, no version branching, no config
      file, no CLI flag.
    gaps: ""
    required: false

